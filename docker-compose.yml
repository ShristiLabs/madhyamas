services:
  madhyamas:
    build:
      context: .
      dockerfile: Dockerfile
    image: madhyamas:latest
    container_name: madhyamas
    ports:
      - "3001:3001" # Web UI / API
      - "8888:8888" # HTTP Proxy
      - "8443:8443" # HTTPS Proxy
    volumes:
      - madhyamas_data:/data
      - ./certs:/data/certs:ro # Mount pre-generated certs if available
    environment:
      - MADHYAMAS_LOG_LEVEL=info
      - MADHYAMAS_API_PORT=3001
      - MADHYAMAS_PROXY_PORT=8888
      - MADHYAMAS_PROXY_TLS_PORT=8443
      - MADHYAMAS_DATA_DIR=/data
      # IMPORTANT: Set this to your machine's LAN IP for mobile device access
      # The container cannot auto-detect the host's network IP
      # Run: ./docker/get-host-ip.sh to find your IP
      - MADHYAMAS_PUBLIC_IP=${MADHYAMAS_PUBLIC_IP:-}
    command: ["--host", "0.0.0.0"]
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3001/api/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - madhyamas_net

  # Host network mode variant - uses host's network stack directly
  # Use this if you need automatic IP detection to work
  madhyamas-host:
    build:
      context: .
      dockerfile: Dockerfile
    image: madhyamas:latest
    container_name: madhyamas-host
    network_mode: host
    volumes:
      - madhyamas_data:/data
      - ./certs:/data/certs:ro
    environment:
      - MADHYAMAS_LOG_LEVEL=info
      - MADHYAMAS_API_PORT=3001
      - MADHYAMAS_PROXY_PORT=8888
      - MADHYAMAS_PROXY_TLS_PORT=8443
      - MADHYAMAS_DATA_DIR=/data
    command: ["--host", "0.0.0.0"]
    restart: unless-stopped
    profiles:
      - host

  # MCP Server for AI assistant integration (Windsurf, Claude, etc.)
  #
  # IMPORTANT LIMITATION: MCP uses stdio transport, which requires direct access to
  # the process's stdin/stdout. Docker containers isolate stdio, so this service
  # CANNOT be used directly by AI assistants running on the host.
  #
  # This service exists primarily for:
  #   1. Building the binary inside Docker (use `docker compose run --rm madhyamas-mcp madhyamas mcp`)
  #   2. Testing the MCP server via `docker exec -i madhyamas-mcp madhyamas mcp`
  #
  # For real AI assistant integration (Windsurf, Claude Desktop, etc.):
  #   - Run `madhyamas mcp` locally on the host, OR
  #   - Extract the binary: `docker cp madhyamas-mcp:/usr/local/bin/madhyamas ./madhyamas`
  #     then run `./madhyamas mcp` locally
  #   - See docs/MCP-INTEGRATION.md for setup instructions
  madhyamas-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: madhyamas:latest
    container_name: madhyamas-mcp
    environment:
      - MADHYAMAS_API_URL=http://madhyamas:3001
      - MADHYAMAS_TIMEOUT=30
    entrypoint: ["madhyamas-mcp"]
    stdin_open: true
    tty: true
    restart: "no"
    depends_on:
      - madhyamas
    networks:
      - madhyamas_net
    profiles:
      - mcp

  # Development service with hot reload
  madhyamas-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: madhyamas:dev
    container_name: madhyamas-dev
    ports:
      - "3001:3001"
      - "8888:8888"
      - "8443:8443"
      - "5173:5173" # Vite dev server
    volumes:
      - madhyamas_data:/data
      - ./crates:/app/crates:ro
      - ./web:/app/web
    environment:
      - RUST_LOG=debug
      - MADHYAMAS_LOG_LEVEL=debug
    profiles:
      - dev
    networks:
      - madhyamas_net

volumes:
  madhyamas_data:
    driver: local

networks:
  madhyamas_net:
    driver: bridge
