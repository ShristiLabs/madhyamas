apiVersion: v1
kind: Secret
metadata:
  name: madhyamas-secrets
  namespace: madhyamas
  labels:
    app.kubernetes.io/name: madhyamas
    app.kubernetes.io/part-of: madhyamas
type: Opaque
# NOTE: Replace these placeholder values with real secrets.
# In production, create this secret via:
#   kubectl create secret generic madhyamas-secrets -n madhyamas \
#     --from-literal=MADHYAMAS_JWT_SECRET=<your-secret> \
#     --from-literal=MADHYAMAS_ADMIN_PASSWORD=<your-password> \
#     --from-literal=MADHYAMAS_REDIS_URL=redis://madhyamas-redis:6379 \
#     --from-literal=MADHYAMAS_DATABASE_URL=postgres://madhyamas:<password>@madhyamas-postgres:5432/madhyamas
# Do NOT commit real secrets to version control.
stringData:
  MADHYAMAS_JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  MADHYAMAS_ADMIN_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  MADHYAMAS_REDIS_URL: "redis://madhyamas-redis:6379"
  MADHYAMAS_DATABASE_URL: "postgres://madhyamas:CHANGE_ME@madhyamas-postgres:5432/madhyamas"
