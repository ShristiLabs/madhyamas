apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: madhyamas-postgres
  namespace: madhyamas
  labels:
    app.kubernetes.io/name: madhyamas-postgres
    app.kubernetes.io/part-of: madhyamas
spec:
  serviceName: madhyamas-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: madhyamas-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: madhyamas-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: madhyamas
            - name: POSTGRES_USER
              value: madhyamas
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: madhyamas-secrets
                  key: MADHYAMAS_ADMIN_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: madhyamas-postgres
  namespace: madhyamas
  labels:
    app.kubernetes.io/name: madhyamas-postgres
    app.kubernetes.io/part-of: madhyamas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: madhyamas-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
