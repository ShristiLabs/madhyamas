apiVersion: apps/v1
kind: Deployment
metadata:
  name: madhyamas
  namespace: madhyamas
  labels:
    app.kubernetes.io/name: madhyamas
    app.kubernetes.io/part-of: madhyamas
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: madhyamas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: madhyamas
    spec:
      containers:
        - name: madhyamas
          image: ghcr.io/madhyamas/madhyamas-enterprise:latest
          ports:
            - name: api
              containerPort: 3001
            - name: proxy
              containerPort: 8888
          envFrom:
            - configMapRef:
                name: madhyamas-config
            - secretRef:
                name: madhyamas-secrets
          env:
            - name: MADHYAMAS_CA_CERT_FILE
              value: /etc/madhyamas/ca/ca-cert.pem
            - name: MADHYAMAS_CA_KEY_FILE
              value: /etc/madhyamas/ca/ca-key.pem
          volumeMounts:
            - name: ca-cert
              mountPath: /etc/madhyamas/ca
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health/detailed
              port: api
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/detailed
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: ca-cert
          secret:
            secretName: madhyamas-ca
            items:
              - key: ca-cert.pem
                path: ca-cert.pem
              - key: ca-key.pem
                path: ca-key.pem
