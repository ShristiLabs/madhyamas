apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: madhyamas-redis
  namespace: madhyamas
  labels:
    app.kubernetes.io/name: madhyamas-redis
    app.kubernetes.io/part-of: madhyamas
spec:
  serviceName: madhyamas-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: madhyamas-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: madhyamas-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: madhyamas-redis
  namespace: madhyamas
  labels:
    app.kubernetes.io/name: madhyamas-redis
    app.kubernetes.io/part-of: madhyamas
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: madhyamas-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
