# VPS (e.g. Hetzner CX) overlay for the demo stack.
#
# Merged on top of docker-compose.yml via COMPOSE_FILE in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.caddy.yml
#
# Adds:
#   - Caddy (ports 80/443, auto-HTTPS) in front of the web UI/API
#
# The proxy listener on :8888 runs PLAINTEXT so that stock iOS/Android
# manual-proxy clients can use it (they cannot speak TLS-to-proxy). Trade-
# off: Proxy-Authorization (the mdy_dev_ key) crosses the network in
# cleartext — demo posture; rotate/revoke device keys from the UI on any
# suspicion. To re-enable TLS: set MADHYAMAS_PROXY_TLS_CERT_FILE/KEY_FILE
# here again (Let's Encrypt via certbot-proxy.sh; startup aborts while
# certs/proxy-tls is empty — run certbot first).

services:
  caddy:
    image: caddy:2
    container_name: caddy-demo
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./acme-web:/var/www/acme
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
