name: madhyamas
version: '0.1.0'
summary: Open-source HTTP/HTTPS debugging proxy with web-based UI
description: |
  Madhyamas is a high-performance, cross-platform HTTP/HTTPS debugging proxy 
  built in Rust with a modern web-based UI. It's the free, open-source 
  alternative to tools like Charles Proxy and Fiddler.

  Features:
  - HTTP/HTTPS traffic interception and inspection
  - Automatic TLS certificate generation
  - Modern React-based web UI
  - Request/response filtering and search
  - Session management for organized debugging
  - WebSocket support
  - MCP integration for AI agents

base: core22
confinement: strict
grade: stable
license: MIT

architectures:
  - build-on: amd64
  - build-on: arm64

apps:
  madhyamas:
    command: bin/madhyamas
    daemon: simple
    plugs:
      - network
      - network-bind
      - home
    environment:
      MADHYAMAS_WEB_DIR: $SNAP/share/madhyamas/web

parts:
  madhyamas:
    plugin: rust
    source: .
    rust-channel: stable
    build-packages:
      - pkg-config
      - libssl-dev
      - nodejs
      - npm
    override-build: |
      # Build the main binary (includes core + api)
      cargo build --release -p madhyamas-cli

      # Build frontend
      cd web
      npm ci
      npm run build
      cd ..

      # Install binary
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cp target/release/madhyamas $SNAPCRAFT_PART_INSTALL/bin/madhyamas

      # Install web assets
      mkdir -p $SNAPCRAFT_PART_INSTALL/share/madhyamas/web
      cp -r web/dist/* $SNAPCRAFT_PART_INSTALL/share/madhyamas/web/

slots:
  madhyamas-data:
    interface: content
    content: data
    source:
      write:
        - $SNAP_DATA/sessions
        - $SNAP_DATA/traffic

plugs:
  madhyamas-certs:
    interface: personal-files
    write:
      - $HOME/.madhyamas/certs
