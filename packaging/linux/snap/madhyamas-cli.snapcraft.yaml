name: madhyamas-cli
version: '0.1.0'
summary: Command-line interface for Madhyamas debugging proxy
description: |
  Madhyamas CLI is the command-line interface for interacting with 
  the Madhyamas HTTP/HTTPS debugging proxy.

  Features:
  - View and filter captured traffic
  - Manage debugging sessions
  - Configure proxy settings
  - Export traffic data

base: core22
confinement: strict
grade: stable
license: MIT

architectures:
  - build-on: amd64
  - build-on: arm64

apps:
  madhyamas-cli:
    command: bin/madhyamas-cli
    plugs:
      - network
      - home
    aliases:
      - pf

parts:
  madhyamas-cli:
    plugin: rust
    source: .
    rust-channel: stable
    build-packages:
      - pkg-config
      - libssl-dev
    override-build: |
      cargo build --release -p madhyamas-cli
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cp target/release/madhyamas-cli $SNAPCRAFT_PART_INSTALL/bin/madhyamas-cli
