apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: licensing-server
  namespace: madhyamas-licensing
  labels:
    app.kubernetes.io/name: madhyamas-licensing
    app.kubernetes.io/part-of: madhyamas
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - licensing.madhyamas.ai
      secretName: licensing-tls
  rules:
    - host: licensing.madhyamas.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: licensing-server
                port:
                  name: http
