apiVersion: v1
kind: Secret
metadata:
  name: licensing-secrets
  namespace: madhyamas-licensing
  labels:
    app.kubernetes.io/name: madhyamas-licensing
    app.kubernetes.io/part-of: madhyamas
type: Opaque
stringData:
  # PostgreSQL connection URL. Replace with your production value.
  database-url: "postgres://madhyamas:CHANGE_ME@postgres:5432/madhyamas"

  # Admin API key for X-Admin-Key header authentication.
  # Replace with a strong random value (e.g. `openssl rand -hex 32`).
  admin-key: "CHANGE_ME"

  # Ed25519 private key (base64-encoded 32 bytes).
  # Generate with: madhyamas-licensing generate-keys --output-dir /tmp/keys
  # Then: base64 -w0 /tmp/keys/ed25519_private.key
  ed25519-private-key: "REPLACE_WITH_BASE64_ENCODED_PRIVATE_KEY"

  # Ed25519 public key (base64-encoded 32 bytes).
  # This is also the value to set as MADHYAMAS_LICENSE_PUBLIC_KEY on proxy
  # instances.
  ed25519-public-key: "REPLACE_WITH_BASE64_ENCODED_PUBLIC_KEY"
