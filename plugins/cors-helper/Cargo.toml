[package]
name = "madhyamas-plugin-cors-helper"
version = "1.0.2-SNAPSHOT"
edition = "2021"
license = "MIT"
description = "CORS Helper plugin for Madhyamas — adds CORS headers to every response"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
madhyamas-plugin-sdk = { path = "../../crates/madhyamas-plugin-sdk" }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# Exclude from the main workspace — plugins have independent versioning
[workspace]
