id = "madhyamas.request-logger"
name = "Request Logger"
version = "1.0.1"
description = "Logs the method, host, and path of every request to the plugin console"
author = "Madhyamas Team"
license = "MIT"
main = "plugin.wasm"
hooks = ["on_request"]
capabilities = ["intercept_request"]
dependencies = {}
enabled_by_default = false
network = false
max_memory_pages = 64
fuel_limit = 10000000
tags = ["logging", "debugging"]
panels = []
