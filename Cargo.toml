[workspace]
resolver = "2"
members = [
    "crates/madhyamas-core",
    "crates/madhyamas-api",
    "crates/madhyamas",
    "crates/madhyamas-cli",
    "crates/madhyamas-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Madhyamas Team"]
repository = "https://github.com/madhyamas/madhyamas"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# HTTP
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
hyper = { version = "1.2", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }

# TLS
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
rcgen = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.15"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"
futures = "0.3"
pin-project-lite = "0.2"
async-trait = "0.1"
once_cell = "1.19"
parking_lot = "0.12"
base64 = "0.22"
regex = "1.10"
rand = "0.9"
sha1 = "0.10"
url = "2.5"
jsonpath_lib = "0.3"
time = "0.3.47"
toml = "1.0"
urlencoding = "2.1"
dirs = "5.0"
reqwest = { version = "0.13", features = ["json"] }

# Decompression (for decoding gzip/deflate/brotli response bodies)
flate2 = "1.0"
brotli = "6.0"

# Internal crates
madhyamas-core = { path = "crates/madhyamas-core" }
madhyamas-api = { path = "crates/madhyamas-api" }
madhyamas-cli = { path = "crates/madhyamas-cli" }
madhyamas-mcp = { path = "crates/madhyamas-mcp" }

# Embedded web assets
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
