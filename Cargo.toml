[workspace]
resolver = "2"
members = [
    "crates/madhyamas-core",
    "crates/madhyamas-api",
    "crates/madhyamas-enterprise",
    "crates/madhyamas",
    "crates/madhyamas-cli",
    "crates/madhyamas-mcp",
    "crates/madhyamas-plugin-sdk",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Madhyamas Team"]
repository = "https://github.com/ShristiLabs/madhyamas"
description = "Open-source HTTP/HTTPS debugging proxy with web-based UI"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# HTTP
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
hyper = { version = "1.2", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
# HTTP/2 frame parsing for downstream (client-facing) connections. Used by
# the proxy engine to accept h2 streams negotiated via ALPN, enabling gRPC
# interception. Pinned to 0.4 to match the version already pulled in
# transitively by reqwest. The `stream` feature enables the
# `futures::Stream` impl on `h2::server::Connection` used by the accept loop.
h2 = { version = "0.4", features = ["stream"] }
# Core HTTP types (Request/Response/Uri/HeaderMap) — already in the dep graph
# via hyper/h2; declared explicitly so the proxy engine can build h2 responses.
http = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header", "limit"] }
tower_governor = "0.8"

# TLS
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
rcgen = "0.14"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "chrono", "uuid", "migrate"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Validation
validator = { version = "0.20", features = ["derive"] }

# Utilities
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"
futures = "0.3"
pin-project-lite = "0.2"
async-trait = "0.1"
once_cell = "1.19"
parking_lot = "0.12"
base64 = "0.22"
regex = "1.10"
rand = "0.9"
sha1 = "0.10"
url = "2.5"
jsonwebtoken = "9"
jsonpath_lib = "0.3"
time = "0.3.47"
toml = "1.0"
urlencoding = "2.1"
dirs = "5.0"
semver = "1.0"
reqwest = { version = "0.13", features = ["json", "gzip", "deflate", "brotli", "zstd", "socks"] }

# Decompression (for decoding gzip/deflate/brotli/zstd response bodies)
flate2 = "1.0"
brotli = "6.0"
zstd = "0.13"

# System information (memory/CPU usage for performance monitoring)
sysinfo = "0.30"

# JavaScript engine for the scripting runtime (boa — pure Rust, sandboxed)
boa_engine = "0.20"
# SHA-256 for the script `crypto.hash` API
sha2 = "0.10"

# Ed25519 signature verification for enterprise license files (Phase 3).
# Pinned to 2.x to match the version already used for plugin signing in
# madhyamas-core; the licensing server must sign with the same crate line.
ed25519-dalek = { version = "2", default-features = false, features = [
    "std",
    "rand_core",
] }

# Argon2id password hashing for enterprise user management (Phase 4a).
# `password-hash` is the companion PHC-string crate; argon2 0.5 re-exports it
# under `argon2::password_hash`, but declaring it explicitly keeps the dep
# graph stable and lets the credentials module import it directly.
argon2 = "0.5"
password-hash = "0.5"

# Internal crates
madhyamas-core = { path = "crates/madhyamas-core", version = "0.1.6" }
madhyamas-api = { path = "crates/madhyamas-api", version = "0.1.6", default-features = false }
madhyamas-cli = { path = "crates/madhyamas-cli", version = "0.1.6" }
madhyamas-mcp = { path = "crates/madhyamas-mcp", version = "0.1.6" }

# Embedded web assets
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"

# Testing
tempfile = "3"
filetime = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1

# Fast profile for CI snapshot builds — thin LTO + parallel codegen
# cuts build time ~50% vs the release profile with minimal binary-size/runtime impact.
# Tagged releases use the strict [profile.release] above.
[profile.ci-release]
inherits = "release"
lto = "thin"
codegen-units = 16
opt-level = 2
