[package]
name = "madhyamas-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["grpc", "scripting", "plugins", "enterprise"]
## gRPC API routes and handlers
grpc = ["madhyamas-core/grpc"]
## Scripting API routes and handlers
scripting = ["madhyamas-core/scripting"]
## Plugin API routes and handlers
plugins = ["madhyamas-core/plugins"]
## Enterprise API routes and handlers (auth, RBAC, audit, onboarding)
enterprise = ["madhyamas-core/enterprise"]

[dependencies]
