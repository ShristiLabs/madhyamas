[package]
name = "madhyamas-enterprise"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "BSL-1.1"
publish = false
authors.workspace = true
description = "Madhyamas enterprise tier: auth, RBAC, audit logging, user management"

[features]
default = []

[dependencies]
madhyamas-api.workspace = true
madhyamas-core.workspace = true
# Shared licensing primitives — single source of truth for the license file
# format and Ed25519 verification (see MAD root Cargo.toml for pinning).
licensing-core.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
async-trait.workspace = true
jsonwebtoken.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
sqlx.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
argon2.workspace = true
password-hash.workspace = true
rand.workspace = true
sha2.workspace = true
redis.workspace = true
futures.workspace = true
url.workspace = true

[dev-dependencies]
# OS RNG for Ed25519 keypair generation in license tests.
rand_core = { version = "0.6", default-features = false, features = ["std"] }
tempfile.workspace = true
