[package]
name = "madhyamas-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Guest SDK for writing Madhyamas plugins in Rust that compile to WASM"
repository.workspace = true
authors.workspace = true

[lib]
# `rlib` for host-side use of types; `cdylib` to produce `plugin.wasm`.
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
# Tiny no_std-compatible logging/panic setup is handled in-tree; no extra deps.

[features]
default = []
# Enable std-only helpers (used when compiling the SDK as an rlib for tests on
# the host). WASM plugins build without this feature.
std = ["serde/std", "serde_json/std"]

# Example plugins are built as cdylibs (no `main`); the resulting `.wasm`
# artifact is a loadable Madhyamas plugin.
[[example]]
name = "cors_helper"
crate-type = ["cdylib"]

[[example]]
name = "request_logger"
crate-type = ["cdylib"]

[[example]]
name = "domain_blocker"
crate-type = ["cdylib"]

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]
