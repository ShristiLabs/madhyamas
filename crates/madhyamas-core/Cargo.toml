[package]
name = "madhyamas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["grpc", "scripting", "plugins", "wasm-runtime", "enterprise"]
## gRPC traffic interception and decoding module
grpc = []
## JavaScript scripting runtime for custom traffic manipulation
scripting = ["dep:boa_engine", "dep:sha2"]
## Plugin system for extending Madhyamas with custom code
## (manifest discovery, registry, settings, install/uninstall — no code execution)
plugins = ["dep:sha2"]
## Sandboxed WASM plugin code execution via `wasmtime`.
## Implies `plugins`. Adds a heavy build dependency (~10MB); disable for
## manifest-only plugin management.
wasm-runtime = ["plugins", "dep:wasmtime", "dep:notify"]
## Enterprise features: auth, RBAC, audit logs, onboarding
enterprise = ["dep:jsonwebtoken"]

[dependencies]
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
h2.workspace = true
http.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
bytes.workspace = true
futures.workspace = true
async-trait.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
base64.workspace = true
regex.workspace = true
rand.workspace = true
sha1.workspace = true
url.workspace = true
jsonwebtoken = { workspace = true, optional = true }
jsonpath_lib.workspace = true
reqwest.workspace = true
toml.workspace = true
urlencoding.workspace = true
dirs.workspace = true
semver.workspace = true
flate2.workspace = true
brotli.workspace = true
zstd.workspace = true
local-ip-address = "0.6"
sysinfo.workspace = true
boa_engine = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# WASM plugin runtime (sandboxed plugin code execution)
wasmtime = { version = "47", optional = true, default-features = false, features = [
    "cranelift",
    "runtime",
    "parallel-compilation",
    "cache",
] }
# Plugin hot-reload (filesystem watcher)
notify = { version = "7", optional = true, default-features = false, features = [
    "macos_fsevent",
] }
# Ed25519 plugin signature verification (Phase 3 signing)
ed25519-dalek = { version = "2", default-features = false, features = [
    "std",
    "rand_core",
] }
# OS RNG for Ed25519 key generation
rand_core = { version = "0.6", default-features = false, features = ["std"] }
# Plugin package (de)compression for install/uninstall
zip = { version = "2", default-features = false, features = ["deflate"] }
# Temp dirs for install extraction (also used in tests)
tempfile = { workspace = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile.workspace = true
filetime.workspace = true
