[package]
name = "madhyamas"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HTTP/HTTPS Debugging Proxy - Unified binary (proxy server + web UI + MCP server + CLI)"
repository.workspace = true
authors.workspace = true

[features]
default = ["grpc", "scripting", "plugins", "wasm-runtime", "enterprise"]
grpc = ["madhyamas-api/grpc", "madhyamas-core/grpc"]
scripting = ["madhyamas-api/scripting", "madhyamas-core/scripting"]
plugins = ["madhyamas-api/plugins", "madhyamas-core/plugins"]
wasm-runtime = ["madhyamas-core/wasm-runtime"]
## Enterprise tier. Pulls in the `madhyamas-enterprise` crate which provides
## authentication, RBAC, audit logging, and user management. Kept in the
## default feature set so the standard build includes enterprise routes.
enterprise = ["dep:madhyamas-enterprise", "dep:sqlx"]
## Embed web UI assets at compile time (requires web/dist/ in workspace root)
## Enabled by the release workflow, not by default (cargo install from
## crates.io won't have web/dist/)
embedded-assets = ["madhyamas-api/embedded-assets"]

[[bin]]
name = "madhyamas"
path = "src/main.rs"

[dependencies]
madhyamas-core.workspace = true
madhyamas-api.workspace = true
madhyamas-cli.workspace = true
madhyamas-mcp.workspace = true
madhyamas-enterprise = { path = "../madhyamas-enterprise", optional = true }
sqlx = { workspace = true, optional = true }
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
