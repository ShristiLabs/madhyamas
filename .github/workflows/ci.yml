name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.yaml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  # Invoked per-PR by ci-pr.yml. Dependabot PRs must come in via the
  # pull_request_target dispatcher: GitHub withholds repo secrets
  # (LICENSING_TOKEN) from pull_request runs triggered by dependabot[bot],
  # so the private licensing-core dep cannot be fetched in that context.
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (PR head SHA when dispatched)"
        required: false
        type: string

# Superseded runs (rapid pushes to the same branch) are cancelled instead
# of stacking full matrix runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # =============================================================================
  # Build frontend once — shared across all downstream jobs via artifact
  # =============================================================================
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check (tsc --noEmit)
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build frontend (full — with tsc type-check)
        working-directory: web
        run: npm run build

      # NOTE: no test step — web/package.json defines no `test` script yet.
      # The old step ran `npm test || echo ...`, which always failed and was
      # always masked. Add a real `npm test` step when a test script exists.

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 3

  # =============================================================================
  # Rust formatting — platform-independent, so it runs once, not per matrix leg
  # =============================================================================
  rust-fmt:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # cargo fmt shells out to cargo metadata, which parses all member
      # manifests — including the private licensing-core git dep.
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # =============================================================================
  # Rust checks: clippy + tests on multiple OS/toolchains
  # Two-tier matrix: enterprise (default features) + oss (no-default-features)
  # Beta legs are clippy-only: early warning of future toolchain breakage
  # without paying for a full test compile.
  # =============================================================================
  rust-checks:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }} (${{ matrix.tier }})
    needs: build-frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        tier: [enterprise, oss]
        include:
          - os: ubuntu-latest
            rust: beta
            tier: enterprise
          - os: ubuntu-latest
            rust: beta
            tier: oss
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.tier }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

      # (No standalone `cargo build` steps: clippy --all-targets type-checks
      # everything and nextest builds all binaries as part of the test run.)

      - name: Run clippy (enterprise tier)
        if: matrix.tier == 'enterprise'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run clippy (oss tier)
        if: matrix.tier == 'oss'
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Install nextest
        if: matrix.rust == 'stable'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Unit tests = lib/bin targets (inline #[cfg(test)] modules);
      # integration tests = tests/ directory targets. Split via nextest
      # filtersets: cargo's --tests/--lib flags overlap (cargo's --tests
      # also selects the lib target), and --lib alone misses bin unit
      # tests (crates/madhyamas/src/main.rs). Multiple -E filters OR.
      - name: Run unit tests (enterprise tier)
        if: matrix.rust == 'stable' && matrix.tier == 'enterprise'
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --verbose --all-features -E 'kind(lib)' -E 'kind(bin)'

      - name: Run integration tests (enterprise tier)
        if: matrix.rust == 'stable' && matrix.tier == 'enterprise'
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --verbose --all-features -E 'kind(test)'

      - name: Run unit tests (oss tier)
        if: matrix.rust == 'stable' && matrix.tier == 'oss'
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --verbose --no-default-features -E 'kind(lib)' -E 'kind(bin)'

      - name: Run integration tests (oss tier)
        if: matrix.rust == 'stable' && matrix.tier == 'oss'
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --verbose --no-default-features -E 'kind(test)'

  # =============================================================================
  # Security audit — both tiers + license compliance (no BSL in OSS)
  # =============================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-audit (pre-built binary)
        run: cargo binstall cargo-audit --no-confirm

      # cargo audit reads Cargo.lock — one run covers all feature tiers.
      # (The former second run was byte-identical to the first.)
      - name: Run security audit
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2024-0384 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0173 --ignore RUSTSEC-2025-0134

      - name: Verify OSS build contains no BSL/enterprise crate
        shell: bash
        run: |
          # The OSS build (--no-default-features) must not pull in the
          # BSL-licensed madhyamas-enterprise crate. Fail CI if it leaks in.
          if cargo tree --no-default-features -p madhyamas 2>/dev/null | grep -q "madhyamas-enterprise"; then
            echo "::error::BSL-licensed madhyamas-enterprise crate leaked into the OSS build (--no-default-features)."
            cargo tree --no-default-features -p madhyamas | grep "madhyamas-enterprise"
            exit 1
          fi
          echo "OK: OSS build does not include madhyamas-enterprise (BSL) crate."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: NPM audit
        working-directory: web
        run: npm audit --audit-level=high || true

  # =============================================================================
  # Docker build test — both tiers via BUILD_TIER build-arg
  # Push/dispatch only: PRs (incl. the dependabot pull_request_target
  # dispatch) are already compile-validated by rust-checks, and the release
  # pipeline builds the image independently anyway.
  # =============================================================================
  docker-build:
    if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    name: Docker Build Test (${{ matrix.tier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [oss, enterprise]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (oss)
        if: matrix.tier == 'oss'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: madhyamas:test-oss
          build-args: |
            BUILD_TIER=oss
          secrets: |
            licensing_token=${{ secrets.LICENSING_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (enterprise)
        if: matrix.tier == 'enterprise'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: madhyamas:test-enterprise
          build-args: |
            BUILD_TIER=enterprise
          secrets: |
            licensing_token=${{ secrets.LICENSING_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Expand the build-binaries matrix up front. PRs build only the Linux
  # cross targets (the platforms rust-checks does NOT compile natively);
  # pushes/dispatches build the full target list. Emitting fully-expanded
  # combinations avoids `include:` merge surprises (partial matches would
  # spawn extra legs with an unset tier).
  # =============================================================================
  prepare-binary-matrix:
    name: Prepare binary matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build matrix JSON
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYEOF'
          import json, os

          meta = {
              "x86_64-unknown-linux-gnu": {"os": "ubuntu-latest"},
              "aarch64-unknown-linux-gnu": {"os": "ubuntu-latest", "cross": True, "cross_arch": "aarch64"},
              "armv7-unknown-linux-gnueabihf": {"os": "ubuntu-latest", "cross": True, "cross_arch": "armv7"},
              "arm-unknown-linux-gnueabihf": {"os": "ubuntu-latest", "cross": True, "cross_arch": "armv6"},
              "riscv64gc-unknown-linux-gnu": {"os": "ubuntu-latest", "cross": True, "cross_arch": "riscv64"},
              "x86_64-apple-darwin": {"os": "macos-14"},
              "aarch64-apple-darwin": {"os": "macos-latest"},
              "x86_64-pc-windows-msvc": {"os": "windows-latest", "archive": "zip"},
          }
          pr_targets = [
              "aarch64-unknown-linux-gnu",
              "armv7-unknown-linux-gnueabihf",
              "riscv64gc-unknown-linux-gnu",
          ]
          # Reduced matrix in any PR context (pull_request or the
          # dependabot pull_request_target dispatch); full on push/dispatch.
          is_pr = os.environ["EVENT_NAME"] in ("pull_request", "pull_request_target")
          targets = pr_targets if is_pr else list(meta)

          combos = []
          for target in targets:
              for tier in ("enterprise", "oss"):
                  entry = {"tier": tier, "target": target, **meta[target]}
                  entry.setdefault("archive", "tar.gz")
                  combos.append(entry)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": combos}) + "\n")
          print(f"Matrix: {len(combos)} combinations for {os.environ['EVENT_NAME']}")
          PYEOF

  # =============================================================================
  # Cross-compile builds — both tiers
  # Single unified binary: proxy + web UI (embedded) + MCP + CLI
  # Uses ci-release profile (thin LTO, parallel codegen) for faster builds.
  # =============================================================================
  build-binaries:
    name: Build madhyamas (${{ matrix.tier }}) for ${{ matrix.target }}
    needs: [rust-checks, build-frontend, prepare-binary-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-binary-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross && runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if [ "${{ matrix.cross_arch }}" = "armv7" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.cross_arch }}" = "armv6" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo "CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.cross_arch }}" = "riscv64" ]; then
            sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
            echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc" >> $GITHUB_ENV
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.tier }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

      - name: Determine short SHA
        id: sha
        shell: bash
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build binary (enterprise tier — ci-release profile)
        if: matrix.tier == 'enterprise'
        run: cargo build --profile ci-release --target ${{ matrix.target }} -p madhyamas

      - name: Build binary (oss tier — ci-release profile, no default features)
        if: matrix.tier == 'oss'
        run: cargo build --profile ci-release --no-default-features --target ${{ matrix.target }} -p madhyamas

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARTIFACT_NAME="madhyamas-${{ matrix.tier }}-${{ steps.sha.outputs.SHORT_SHA }}-${{ matrix.target }}"
          mkdir -p dist/$ARTIFACT_NAME
          cp target/${{ matrix.target }}/ci-release/madhyamas dist/$ARTIFACT_NAME/
          cd dist
          tar -czvf $ARTIFACT_NAME.tar.gz $ARTIFACT_NAME
          if command -v sha256sum &> /dev/null; then
            sha256sum $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256
          else
            shasum -a 256 $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ARTIFACT_NAME = "madhyamas-${{ matrix.tier }}-${{ steps.sha.outputs.SHORT_SHA }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist\$ARTIFACT_NAME" -Force
          Copy-Item "target\${{ matrix.target }}\ci-release\madhyamas.exe" "dist\$ARTIFACT_NAME\"
          cd dist
          7z a "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME"
          $hash = Get-FileHash "$ARTIFACT_NAME.zip" -Algorithm SHA256
          "$($hash.Hash)  $ARTIFACT_NAME.zip" | Out-File "$ARTIFACT_NAME.zip.sha256" -Encoding ASCII

      - name: Upload build artifact (3 days retention)
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-${{ matrix.tier }}-${{ matrix.target }}
          path: dist/madhyamas-*.*
          retention-days: 3
