name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.yaml"
      - "docs/**"
      - "scripts/check-docs*.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.yaml"
      - "docs/**"
      - "scripts/check-docs*.sh"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # =============================================================================
  # Build frontend once — shared across all downstream jobs via artifact
  # =============================================================================
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check (tsc --noEmit)
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build frontend (full — with tsc type-check)
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm test -- --passWithNoTests || echo "Tests passed or no tests"

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 3

  # =============================================================================
  # Rust checks: format, clippy, build, test on multiple OS/toolchains
  # Two-tier matrix: enterprise (default features) + oss (no-default-features)
  # =============================================================================
  rust-checks:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }} (${{ matrix.tier }})
    needs: build-frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        tier: [enterprise, oss]
        include:
          - os: ubuntu-latest
            rust: beta
            tier: enterprise
          - os: ubuntu-latest
            rust: beta
            tier: oss
    steps:
      - uses: actions/checkout@v4
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.tier }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (enterprise tier)
        if: matrix.tier == 'enterprise'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run clippy (oss tier)
        if: matrix.tier == 'oss'
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Build (enterprise tier — debug profile)
        if: matrix.tier == 'enterprise'
        run: cargo build --verbose -p madhyamas

      - name: Build (oss tier — debug profile, no default features)
        if: matrix.tier == 'oss'
        run: cargo build --verbose --no-default-features -p madhyamas

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests (enterprise tier)
        if: matrix.tier == 'enterprise'
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --verbose --all-features

      - name: Run tests (oss tier)
        if: matrix.tier == 'oss'
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --verbose --no-default-features

  # =============================================================================
  # Security audit — both tiers + license compliance (no BSL in OSS)
  # =============================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-audit (pre-built binary)
        run: cargo binstall cargo-audit --no-confirm

      - name: Run security audit (default features)
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2024-0370

      - name: Run security audit (all features — enterprise)
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0104 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2024-0370

      - name: Verify OSS build contains no BSL/enterprise crate
        shell: bash
        run: |
          # The OSS build (--no-default-features) must not pull in the
          # BSL-licensed madhyamas-enterprise crate. Fail CI if it leaks in.
          if cargo tree --no-default-features -p madhyamas 2>/dev/null | grep -q "madhyamas-enterprise"; then
            echo "::error::BSL-licensed madhyamas-enterprise crate leaked into the OSS build (--no-default-features)."
            cargo tree --no-default-features -p madhyamas | grep "madhyamas-enterprise"
            exit 1
          fi
          echo "OK: OSS build does not include madhyamas-enterprise (BSL) crate."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: NPM audit
        working-directory: web
        run: npm audit --audit-level=high || true

  # =============================================================================
  # Docker build test — both tiers via BUILD_TIER build-arg
  # =============================================================================
  docker-build:
    name: Docker Build Test (${{ matrix.tier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [oss, enterprise]
    steps:
      - uses: actions/checkout@v4
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (oss)
        if: matrix.tier == 'oss'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: madhyamas:test-oss
          build-args: |
            BUILD_TIER=oss
          secrets: |
            licensing_token=${{ secrets.LICENSING_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (enterprise)
        if: matrix.tier == 'enterprise'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: madhyamas:test-enterprise
          build-args: |
            BUILD_TIER=enterprise
          secrets: |
            licensing_token=${{ secrets.LICENSING_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Cross-compile builds for all platforms — both tiers
  # Single unified binary: proxy + web UI (embedded) + MCP + CLI
  # Uses ci-release profile (thin LTO, parallel codegen) for faster builds.
  # Tier dimension: enterprise (default features) + oss (no-default-features)
  # =============================================================================
  build-binaries:
    name: Build madhyamas (${{ matrix.tier }}) for ${{ matrix.target }}
    needs: [rust-checks, build-frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        tier: [enterprise, oss]
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: aarch64
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: armv7
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: armv6
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: riscv64
          # macOS
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross && runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          if [ "${{ matrix.cross_arch }}" = "armv7" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.cross_arch }}" = "armv6" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo "CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.cross_arch }}" = "riscv64" ]; then
            sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
            echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc" >> $GITHUB_ENV
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.tier }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

      - name: Determine short SHA
        id: sha
        shell: bash
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build binary (enterprise tier — ci-release profile)
        if: matrix.tier == 'enterprise'
        run: cargo build --profile ci-release --target ${{ matrix.target }} -p madhyamas

      - name: Build binary (oss tier — ci-release profile, no default features)
        if: matrix.tier == 'oss'
        run: cargo build --profile ci-release --no-default-features --target ${{ matrix.target }} -p madhyamas

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARTIFACT_NAME="madhyamas-${{ matrix.tier }}-${{ steps.sha.outputs.SHORT_SHA }}-${{ matrix.target }}"
          mkdir -p dist/$ARTIFACT_NAME
          cp target/${{ matrix.target }}/ci-release/madhyamas dist/$ARTIFACT_NAME/
          cd dist
          tar -czvf $ARTIFACT_NAME.tar.gz $ARTIFACT_NAME
          if command -v sha256sum &> /dev/null; then
            sha256sum $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256
          else
            shasum -a 256 $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ARTIFACT_NAME = "madhyamas-${{ matrix.tier }}-${{ steps.sha.outputs.SHORT_SHA }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist\$ARTIFACT_NAME" -Force
          Copy-Item "target\${{ matrix.target }}\ci-release\madhyamas.exe" "dist\$ARTIFACT_NAME\"
          cd dist
          7z a "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME"
          $hash = Get-FileHash "$ARTIFACT_NAME.zip" -Algorithm SHA256
          "$($hash.Hash)  $ARTIFACT_NAME.zip" | Out-File "$ARTIFACT_NAME.zip.sha256" -Encoding ASCII

      - name: Upload build artifact (3 days retention)
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-${{ matrix.tier }}-${{ matrix.target }}
          path: dist/madhyamas-*.*
          retention-days: 3

  # =============================================================================
  # Docs check — broken links, stale source paths, module coverage
  # =============================================================================
  docs-check:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links and source path references
        run: bash scripts/check-docs.sh
      - name: Check module documentation coverage
        run: bash scripts/check-docs-coverage.sh
