name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # =============================================================================
  # Rust checks: format, clippy, build, test on multiple OS/toolchains
  # =============================================================================
  rust-checks:
    name: Rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  # =============================================================================
  # Frontend checks
  # =============================================================================
  frontend-checks:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck || npm run type-check || echo "No typecheck script"

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm test -- --passWithNoTests || echo "Tests passed or no tests"

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 3

  # =============================================================================
  # Security audit
  # =============================================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: NPM audit
        working-directory: web
        run: npm audit --audit-level=high || true

  # =============================================================================
  # Docker build test
  # =============================================================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: madhyamas:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Cross-compile builds for all platforms (including Raspberry Pi Zero)
  # =============================================================================
  build-binaries:
    name: Build ${{ matrix.package }} for ${{ matrix.target }}
    needs: [rust-checks, frontend-checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Madhyamas Main (with web UI) ---
          # Linux x86_64
          - package: madhyamas
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            build_web: true
          # Linux ARM64 (Pi 4/5, etc.)
          - package: madhyamas
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            build_web: true
            cross: true
            cross_arch: aarch64
          # Linux ARM6 (Raspberry Pi Zero)
          - package: madhyamas
            target: armv6-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            build_web: true
            cross: true
            cross_arch: arm
          # macOS Intel
          - package: madhyamas
            target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
            build_web: true
          # macOS Apple Silicon
          - package: madhyamas
            target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            build_web: true
          # Windows x64
          - package: madhyamas
            target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            build_web: true

          # --- Madhyamas CLI ---
          - package: madhyamas-cli
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - package: madhyamas-cli
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: aarch64
          - package: madhyamas-cli
            target: armv6-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: arm
          - package: madhyamas-cli
            target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - package: madhyamas-cli
            target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - package: madhyamas-cli
            target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

          # --- Madhyamas MCP ---
          - package: madhyamas-mcp
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - package: madhyamas-mcp
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: aarch64
          - package: madhyamas-mcp
            target: armv6-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: arm
          - package: madhyamas-mcp
            target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - package: madhyamas-mcp
            target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - package: madhyamas-mcp
            target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          if [ "${{ matrix.cross_arch }}" = "arm" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo "CARGO_TARGET_ARMV6_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.package }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ matrix.package }}-cargo-

      - name: Setup Node.js
        if: matrix.build_web
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        if: matrix.build_web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Determine short SHA
        id: sha
        shell: bash
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build binary (release)
        run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.package }}

      - name: Determine binary name
        id: binary
        shell: bash
        run: |
          if [ "${{ matrix.package }}" = "madhyamas" ]; then
            echo "NAME=madhyamas" >> $GITHUB_OUTPUT
          else
            echo "NAME=${{ matrix.package }}" >> $GITHUB_OUTPUT
          fi

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARTIFACT_NAME="${{ matrix.package }}-${{ steps.sha.outputs.SHORT_SHA }}-${{ matrix.target }}"
          mkdir -p dist/$ARTIFACT_NAME

          # Copy binary
          cp target/${{ matrix.target }}/release/${{ steps.binary.outputs.NAME }} dist/$ARTIFACT_NAME/

          # Copy web assets for main package
          if [ "${{ matrix.build_web }}" = "true" ]; then
            cp -r web/dist dist/$ARTIFACT_NAME/web
          fi

          # Create archive
          cd dist
          tar -czvf $ARTIFACT_NAME.tar.gz $ARTIFACT_NAME

          # Generate checksum
          sha256sum $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ARTIFACT_NAME = "${{ matrix.package }}-${{ steps.sha.outputs.SHORT_SHA }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist\$ARTIFACT_NAME" -Force

          # Copy binary
          Copy-Item "target\${{ matrix.target }}\release\${{ steps.binary.outputs.NAME }}.exe" "dist\$ARTIFACT_NAME\"

          # Copy web assets for main package
          if ("${{ matrix.build_web }}" -eq "true") {
            Copy-Item -Recurse "web\dist" "dist\$ARTIFACT_NAME\web"
          }

          # Create archive
          cd dist
          7z a "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME"

          # Generate checksum
          $hash = Get-FileHash "$ARTIFACT_NAME.zip" -Algorithm SHA256
          "$($hash.Hash)  $ARTIFACT_NAME.zip" | Out-File "$ARTIFACT_NAME.zip.sha256" -Encoding ASCII

      - name: Upload build artifact (3 days retention)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: dist/${{ matrix.package }}-*.*
          retention-days: 3
