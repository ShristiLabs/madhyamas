name: Plugin Release

on:
  push:
    tags:
      # Pattern: <plugin-name>-vX.Y.Z  (e.g. cors-helper-v1.0.1)
      - "*-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      plugin_name:
        description: "Plugin name (e.g. cors-helper)"
        required: true
      version:
        description: "Version to release (e.g. 1.0.1)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # =============================================================================
  # Decide whether this tag still needs a release built. Tags pushed by the
  # Plugin Release Dispatch workflow are fully handled there (build, release,
  # registry, SNAPSHOT bump) — the tag push re-triggers this workflow, and
  # without a skip it would race the dispatch run: duplicate release-create
  # failures and double SNAPSHOT bumps. The marker is deterministic: the
  # dispatch workflow tags the commit it creates, whose subject is exactly
  # "release: <plugin> v<version>".
  # =============================================================================
  check:
    name: Check release status
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      plugin: ${{ steps.parse.outputs.plugin }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Parse tag
        id: parse
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            plugin_name="${{ github.event.inputs.plugin_name }}"
            version="${{ github.event.inputs.version }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            # Extract version (everything after the last -v)
            version="${tag##*-v}"
            # Extract plugin name (everything before the last -v)
            plugin_name="${tag%-v*}"
          fi

          echo "plugin=${plugin_name}" >> $GITHUB_OUTPUT
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "tag=${plugin_name}-v${version}" >> $GITHUB_OUTPUT
          echo "Parsed: plugin=${plugin_name}, version=${version}, tag=${plugin_name}-v${version}"

      - name: Decide skip or proceed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          plugin="${{ steps.parse.outputs.plugin }}"
          version="${{ steps.parse.outputs.version }}"
          tag="${{ steps.parse.outputs.tag }}"

          # 1. Dispatch-owned tag? (commit subject marker — race-free)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag_commit=$(git rev-list -n 1 "$tag")
            subject=$(git log -1 --format=%s "$tag_commit")
            if [[ "$subject" == "release: ${plugin} v${version}" ]]; then
              echo "Tag $tag points at the dispatch workflow's release commit ('${subject}')."
              echo "The dispatch workflow builds, releases, and bumps SNAPSHOT itself — skipping."
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # 2. Release already exists (e.g. re-tagged manually)?
          if gh release view "$tag" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release ${tag} already exists — nothing to do."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3. Validate plugin directory.
          if [[ ! -d "plugins/${plugin}" ]]; then
            echo "ERROR: Plugin directory not found: plugins/${plugin}" >&2
            exit 1
          fi
          if [[ ! -f "plugins/${plugin}/Cargo.toml" ]]; then
            echo "ERROR: Plugin Cargo.toml not found" >&2
            exit 1
          fi

          # 4. Verify manifest versions match the tag (no SNAPSHOT).
          cargo_version=$(grep '^version' "plugins/${plugin}/Cargo.toml" | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          manifest_version=$(grep '^version' "plugins/${plugin}/madhyamas-plugin.toml" | head -1 | sed 's/.*= *"\(.*\)"/\1/')

          echo "Cargo.toml version: ${cargo_version}"
          echo "Manifest version: ${manifest_version}"
          echo "Expected version: ${version}"

          if [[ "$cargo_version" == *"SNAPSHOT"* ]]; then
            echo "ERROR: Cargo.toml version is a SNAPSHOT (${cargo_version}). Remove -SNAPSHOT suffix before releasing." >&2
            echo "  Edit plugins/${plugin}/Cargo.toml and madhyamas-plugin.toml" >&2
            echo "  Change version from '${cargo_version}' to '${version}'" >&2
            exit 1
          fi
          if [[ "$cargo_version" != "$version" ]]; then
            echo "ERROR: Cargo.toml version (${cargo_version}) does not match tag version (${version})" >&2
            exit 1
          fi
          if [[ "$manifest_version" != "$version" ]]; then
            echo "ERROR: Manifest version (${manifest_version}) does not match tag version (${version})" >&2
            exit 1
          fi

          echo "Version verification passed."
          echo "skip=false" >> $GITHUB_OUTPUT

  # =============================================================================
  # Build + release (only when the check job did not skip)
  # =============================================================================
  release:
    name: Release plugin
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build plugin
        run: ./scripts/build-plugin.sh ${{ needs.check.outputs.plugin }}

      - name: Compute checksum
        id: checksum
        run: |
          zip_file="plugins/${{ needs.check.outputs.plugin }}-${{ needs.check.outputs.version }}.zip"
          echo "zip=${zip_file}" >> $GITHUB_OUTPUT
          echo "sha256=$(sha256sum ${zip_file} | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.check.outputs.tag }}" \
            --title "${{ needs.check.outputs.plugin }} v${{ needs.check.outputs.version }}" \
            --notes "Release ${{ needs.check.outputs.plugin }} v${{ needs.check.outputs.version }}

          Built from commit ${{ github.sha }}

          SHA-256: \`${{ steps.checksum.outputs.sha256 }}\`
          " \
            "${{ steps.checksum.outputs.zip }}"

      - name: Update registry.json
        run: |
          REGISTRY_URL="https://github.com/${{ github.repository }}/releases/download/${{ needs.check.outputs.tag }}"
          python3 - "${{ needs.check.outputs.plugin }}" "${{ needs.check.outputs.version }}" "${{ steps.checksum.outputs.sha256 }}" "$REGISTRY_URL" plugins/registry.json <<'PYEOF'
          import json, sys, datetime

          plugin_name = sys.argv[1]
          version = sys.argv[2]
          checksum = sys.argv[3]
          url_base = sys.argv[4]
          registry_path = sys.argv[5]

          plugin_id = f"madhyamas.{plugin_name}"
          download_url = f"{url_base}/{plugin_name}-{version}.zip"

          with open(registry_path) as f:
              data = json.load(f)

          found = False
          for entry in data["plugins"]:
              if entry["manifest"]["id"] == plugin_id:
                  entry["manifest"]["version"] = version
                  entry["download_url"] = download_url
                  entry["checksum"] = f"sha256:{checksum}"
                  entry["updated_at"] = datetime.datetime.now(datetime.UTC).isoformat().replace("+00:00", "Z")
                  found = True
                  break

          if not found:
              print(f"WARNING: Plugin {plugin_id} not found in registry.json", file=sys.stderr)

          with open(registry_path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print(f"Updated {registry_path}: {plugin_id} v{version}")
          PYEOF

      - name: Commit updated registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/registry.json
          if git diff --cached --quiet; then
            echo "registry.json unchanged, skipping commit"
          else
            git commit -m "chore: update registry.json for ${{ needs.check.outputs.plugin }} v${{ needs.check.outputs.version }}

          Auto-generated by the Plugin Release workflow.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            # Retry push with rebase in case another release ran in parallel
            for i in 1 2 3; do
              git stash --keep-index 2>/dev/null || true
              git pull --rebase origin main
              git stash pop 2>/dev/null || true
              git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      - name: Bump to next SNAPSHOT version
        run: |
          plugin_dir="plugins/${{ needs.check.outputs.plugin }}"
          current="${{ needs.check.outputs.version }}"

          # Parse version and bump patch
          IFS='.' read -r major minor patch <<< "$current"
          next_patch=$((patch + 1))
          next_version="${major}.${minor}.${next_patch}-SNAPSHOT"

          echo "Bumping from ${current} to ${next_version}"

          # Update Cargo.toml
          sed -i "s/^version = \".*\"/version = \"${next_version}\"/" "${plugin_dir}/Cargo.toml"

          # Update manifest
          sed -i "s/^version = \".*\"/version = \"${next_version}\"/" "${plugin_dir}/madhyamas-plugin.toml"

          echo "Bumped to ${next_version}"

      - name: Commit SNAPSHOT bump
        run: |
          plugin_dir="plugins/${{ needs.check.outputs.plugin }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${plugin_dir}/Cargo.toml" "${plugin_dir}/madhyamas-plugin.toml"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump ${{ needs.check.outputs.plugin }} to next SNAPSHOT

          Auto-bumped after releasing v${{ needs.check.outputs.version }}.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            # Retry push with rebase in case another release ran in parallel
            for i in 1 2 3; do
              git stash --keep-index 2>/dev/null || true
              git pull --rebase origin main
              git stash pop 2>/dev/null || true
              git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
