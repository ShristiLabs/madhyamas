name: Build & Release Plugins

on:
  push:
    branches: [main]
    paths:
      - "crates/madhyamas-plugin-sdk/**"
      - "plugins/*/madhyamas-plugin.toml"
      - "plugins/registry.json"
      - "scripts/build-plugins.sh"
      - ".github/workflows/plugins.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (default: plugins-latest)"
        required: false
        default: "plugins-latest"

env:
  CARGO_TERM_COLOR: always

jobs:
  build-plugins:
    name: Build and package plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "wasm-plugins"

      - name: Build and package plugins
        run: ./scripts/build-plugins.sh

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: |
            plugins/cors-helper-1.0.0.zip
            plugins/request-logger-1.0.0.zip
            plugins/domain-blocker-1.0.0.zip
          retention-days: 30
          if-no-files-found: error

  release-plugins:
    name: Release plugins to GitHub Releases
    needs: build-plugins
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          name: plugin-packages
          path: plugins/

      - name: Determine release tag
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=plugins-latest" >> $GITHUB_OUTPUT
          fi

      - name: Compute checksums
        id: checksums
        run: |
          echo "cors_helper=$(sha256sum plugins/cors-helper-1.0.0.zip | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "request_logger=$(sha256sum plugins/request-logger-1.0.0.zip | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "domain_blocker=$(sha256sum plugins/domain-blocker-1.0.0.zip | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Delete existing release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.tag.outputs.tag }}" --yes --cleanup-tag 2>/dev/null || true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "Madhyamas Plugins" \
            --notes "Auto-built plugin packages from commit ${{ github.sha }}

          ## Plugins

          - **cors-helper** v1.0.0 — Adds CORS headers to every response
          - **request-logger** v1.0.0 — Logs method/host/path of each request
          - **domain-blocker** v1.0.0 — Blocks configurable domains

          ## Checksums (SHA-256)

          - cors-helper: \`${{ steps.checksums.outputs.cors_helper }}\`
          - request-logger: \`${{ steps.checksums.outputs.request_logger }}\`
          - domain-blocker: \`${{ steps.checksums.outputs.domain_blocker }}\`
          " \
            plugins/cors-helper-1.0.0.zip \
            plugins/request-logger-1.0.0.zip \
            plugins/domain-blocker-1.0.0.zip

      - name: Update registry.json with release URLs and checksums
        run: |
          REGISTRY_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}"
          ./scripts/build-plugins.sh --update-registry --registry-url "$REGISTRY_URL" || true
          # build-plugins.sh rebuilds the zips, but we only need the registry update.
          # The checksums should match since the source code is the same.

      - name: Commit updated registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/registry.json
          if git diff --cached --quiet; then
            echo "registry.json unchanged, skipping commit"
          else
            git commit -m "chore: update registry.json with plugin release URLs

          Auto-generated by the Build & Release Plugins workflow.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push
          fi
