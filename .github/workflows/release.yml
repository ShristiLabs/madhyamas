name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  # =============================================================================
  # Build frontend once — shared across all downstream jobs via artifact
  # =============================================================================
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build frontend (full — with tsc type-check)
        working-directory: web
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 3

  # =============================================================================
  # Test gate — run tests before any build/publish steps
  # =============================================================================
  test-gate:
    name: Test Gate
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-gate

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --verbose

  # =============================================================================
  # Build the unified binary for all platforms — both tiers
  # Single binary includes: proxy server + web UI (embedded) + MCP server + CLI
  # Tier dimension: enterprise (default features) + oss (no-default-features)
  # OSS artifacts: madhyamas-oss-v{ver}-{target}; enterprise: madhyamas-enterprise-v{ver}-{target}
  # =============================================================================
  build-binaries:
    needs: test-gate
    name: Build madhyamas (${{ matrix.tier }}) for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        tier: [enterprise, oss]
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: aarch64
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: armv7
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: armv6
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: riscv64
          # macOS
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          if [ "${{ matrix.cross_arch }}" = "armv7" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.cross_arch }}" = "armv6" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo "CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.cross_arch }}" = "riscv64" ]; then
            sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
            echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc" >> $GITHUB_ENV
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.tier }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${RELEASE_VERSION:-${GITHUB_REF#refs/tags/v}}" >> $GITHUB_OUTPUT

      - name: Build binary (enterprise tier)
        if: matrix.tier == 'enterprise'
        run: cargo build --release --target ${{ matrix.target }} -p madhyamas --features embedded-assets

      - name: Build binary (oss tier — no default features + embedded-assets)
        if: matrix.tier == 'oss'
        run: cargo build --release --no-default-features --features embedded-assets --target ${{ matrix.target }} -p madhyamas

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARTIFACT_NAME="madhyamas-${{ matrix.tier }}-v${{ steps.version.outputs.VERSION }}-${{ matrix.target }}"
          mkdir -p dist/$ARTIFACT_NAME
          cp target/${{ matrix.target }}/release/madhyamas dist/$ARTIFACT_NAME/
          cd dist
          tar -czvf $ARTIFACT_NAME.tar.gz $ARTIFACT_NAME
          if command -v sha256sum &> /dev/null; then
            sha256sum $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256
          else
            shasum -a 256 $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ARTIFACT_NAME = "madhyamas-${{ matrix.tier }}-v${{ steps.version.outputs.VERSION }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist\$ARTIFACT_NAME" -Force
          Copy-Item "target\${{ matrix.target }}\release\madhyamas.exe" "dist\$ARTIFACT_NAME\"
          cd dist
          7z a "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME"
          $hash = Get-FileHash "$ARTIFACT_NAME.zip" -Algorithm SHA256
          "$($hash.Hash)  $ARTIFACT_NAME.zip" | Out-File "$ARTIFACT_NAME.zip.sha256" -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-${{ matrix.tier }}-${{ matrix.target }}
          path: dist/madhyamas-*.*

  # =============================================================================
  # Build Windows MSI Installer
  # =============================================================================
  build-msi:
    name: Build Windows MSI Installer
    needs: build-binaries
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Download Windows artifact (OSS)
        uses: actions/download-artifact@v4
        with:
          name: madhyamas-oss-x86_64-pc-windows-msvc
          path: artifacts

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${RELEASE_VERSION:-${GITHUB_REF#refs/tags/v}}" >> $GITHUB_OUTPUT

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Prepare MSI source files
        shell: pwsh
        run: |
          # Update version in .wxs file (only the Package Version attribute, not the XML declaration)
          $wxs = Get-Content "packaging/windows/msi/madhyamas.wxs" -Raw
          $wxs = $wxs -replace '(?<=Package[^>]*\s)Version="[^"]*"', "Version=`"${{ steps.version.outputs.VERSION }}`""
          Set-Content "packaging/windows/msi/madhyamas.wxs" $wxs
          New-Item -ItemType Directory -Path "msi-source\bin" -Force
          $artifacts = Get-ChildItem -Path "artifacts" -Recurse -Filter "*.zip"
          foreach ($artifact in $artifacts) {
            7z x $artifact.FullName -o"temp" -y
          }
          Copy-Item "temp\madhyamas-*\madhyamas.exe" "msi-source\bin\" -ErrorAction SilentlyContinue

      - name: Build MSI
        shell: pwsh
        working-directory: packaging/windows/msi
        run: |
          wix build madhyamas.wxs -acceptEula wix7 -d SourceDir="../../../msi-source" -d Version="${{ steps.version.outputs.VERSION }}" -o "../../../dist/madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi"

      - name: Generate MSI checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash "dist\madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi" -Algorithm SHA256
          "$($hash.Hash)  madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi" | Out-File "dist\madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi.sha256" -Encoding ASCII

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-msi
          path: dist/madhyamas-v*.msi*

  # =============================================================================
  # Build Snap package
  # =============================================================================
  build-snap:
    name: Build Snap Package
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${RELEASE_VERSION:-${GITHUB_REF#refs/tags/v}}" >> $GITHUB_OUTPUT

      - name: Copy snapcraft file
        run: |
          mkdir -p snap
          # Update version in snapcraft.yaml
          sed -i "s/^version: .*/version: '${{ steps.version.outputs.VERSION }}'/" packaging/linux/snap/madhyamas.snapcraft.yaml
          cp packaging/linux/snap/madhyamas.snapcraft.yaml snap/snapcraft.yaml

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Rename snap file
        run: |
          mv ${{ steps.snapcraft.outputs.snap }} madhyamas-v${{ steps.version.outputs.VERSION }}.snap

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-snap
          path: madhyamas-v*.snap

  # =============================================================================
  # Build RPM package
  # =============================================================================
  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    container: fedora:latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools rust cargo openssl-devel gcc nodejs npm systemd-rpm-macros

      - name: Build frontend (skip tsc — already checked in test-gate)
        working-directory: web
        run: |
          npm ci
          npm run build:fast

      - name: Setup RPM build environment
        run: rpmdev-setuptree

      - name: Extract version
        id: version
        run: echo "VERSION=${RELEASE_VERSION:-${GITHUB_REF#refs/tags/v}}" >> $GITHUB_OUTPUT

      - name: Copy spec file
        run: |
          # Update version in spec file
          sed -i "s/^Version: .*/Version: ${{ steps.version.outputs.VERSION }}/" packaging/linux/rpm/madhyamas.spec
          cp packaging/linux/rpm/madhyamas.spec ~/rpmbuild/SPECS/
          if [ -f packaging/linux/rpm/madhyamas.service ]; then
            cp packaging/linux/rpm/madhyamas.service ~/rpmbuild/SOURCES/
          fi

      - name: Create source tarball
        run: |
          tar -czvf ~/rpmbuild/SOURCES/v${{ steps.version.outputs.VERSION }}.tar.gz \
            --transform "s,^,madhyamas-${{ steps.version.outputs.VERSION }}/," \
            --exclude='.git' --exclude='target' --exclude='node_modules' .

      - name: Build RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/madhyamas.spec

      - name: Copy RPM to dist
        run: |
          mkdir -p dist
          cp ~/rpmbuild/RPMS/*/*.rpm dist/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-rpm
          path: dist/*.rpm

  # =============================================================================
  # Create GitHub Release
  # =============================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-msi, build-snap, build-rpm]
    runs-on: ubuntu-latest
    if: always() && needs.build-binaries.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        id: download
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: madhyamas-*
        continue-on-error: true

      - name: Retry artifact download
        if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: madhyamas-*

      - name: Verify artifacts downloaded
        run: |
          if [ -z "$(ls -A artifacts/ 2>/dev/null)" ]; then
            echo "::error::No artifacts were downloaded after retry."
            exit 1
          fi
          echo "Artifacts downloaded successfully:"
          ls -la artifacts/

      - name: Extract version
        id: version
        run: echo "VERSION=${RELEASE_VERSION:-${GITHUB_REF#refs/tags/v}}" >> $GITHUB_OUTPUT

      - name: Collect release files
        run: |
          mkdir -p release
          # merge-multiple puts all files in artifacts/ directly
          cp artifacts/*.tar.gz artifacts/*.sha256 release/ 2>/dev/null || true
          cp artifacts/*.zip release/ 2>/dev/null || true
          cp artifacts/*.msi release/ 2>/dev/null || true
          cp artifacts/*.snap release/ 2>/dev/null || true
          # Only copy the main RPM, not debuginfo/debugsource
          for rpm in artifacts/*.x86_64.rpm; do
            case "$(basename "$rpm")" in
              *debuginfo*|*debugsource*) ;;
              *) cp "$rpm" release/ ;;
            esac
          done
          echo "Release files:"
          ls -la release/

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Extract the changelog section for this version
          if grep -q "## \[$VERSION\]" CHANGELOG.md; then
            NOTES=$(awk "/## \[$VERSION\]/{found=1; next} /^## \[/{found=0} found" CHANGELOG.md | sed '/^$/d; /^###/d' | head -20)
            if [ -n "$NOTES" ]; then
              {
                echo "CHANGES<<EOF"
              echo "$NOTES"
                echo "EOF"
              } >> $GITHUB_OUTPUT
            else
              echo "CHANGES=See [CHANGELOG.md](CHANGELOG.md) for details." >> $GITHUB_OUTPUT
            fi
          else
            echo "CHANGES=See [CHANGELOG.md](CHANGELOG.md) for details." >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Madhyamas v${{ steps.version.outputs.VERSION }}
          body: |
            ## Madhyamas v${{ steps.version.outputs.VERSION }}

            **Single unified binary** — proxy server, web UI, MCP server, and CLI in one executable.
            Web UI assets are embedded in the binary — no external files needed.

            ### Installation

            #### macOS (Homebrew)
            ```bash
            brew tap ShristiLabs/tap
            brew install madhyamas
            ```

            #### Windows (Chocolatey)
            ```powershell
            choco install madhyamas
            ```

            #### Windows (MSI Installer)
            Download `madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi`

            #### Linux (Snap)
            ```bash
            sudo snap install madhyamas
            ```

            #### Linux (DNF/YUM)
            ```bash
            # Download the RPM from the assets below, then:
            sudo dnf install ./madhyamas-*.x86_64.rpm
            ```

            ### Usage

            ```bash
            # Start proxy server with web UI (default)
            ./madhyamas
            # or: ./madhyamas serve

            # Web UI: http://localhost:3001
            # Proxy:  localhost:8888

            # Run as MCP server (stdio transport)
            ./madhyamas mcp

            # CLI commands
            ./madhyamas traffic list
            ./madhyamas mocks list
            ./madhyamas breakpoints list
            ./madhyamas sessions list
            ./madhyamas throttle get
            # ... and more (run ./madhyamas --help)
            ```

            ### Downloads

            This release ships **two tiers** from the same commit:

            - **OSS (Simple)** — `madhyamas-oss-*` — MIT/Apache-2.0, no enterprise code.
              Install via Homebrew/Chocolatey/Snap/DNF or download below.
            - **Enterprise** — `madhyamas-enterprise-*` — includes auth, RBAC, audit
              logging (BSL-1.1 `madhyamas-enterprise` crate). Requires a license file.
              Not published to crates.io or package managers.

            #### OSS (Simple) binaries

            | Platform | Download |
            |----------|----------|
            | Linux x64 | `madhyamas-oss-v${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux ARM64 | `madhyamas-oss-v${{ steps.version.outputs.VERSION }}-aarch64-unknown-linux-gnu.tar.gz` |
            | Linux ARMv7 (Pi 2/3/4 32-bit) | `madhyamas-oss-v${{ steps.version.outputs.VERSION }}-armv7-unknown-linux-gnueabihf.tar.gz` |
            | Linux ARMv6 (Pi 1/Zero 32-bit) | `madhyamas-oss-v${{ steps.version.outputs.VERSION }}-arm-unknown-linux-gnueabihf.tar.gz` |
            | Linux RISC-V 64 | `madhyamas-oss-v${{ steps.version.outputs.VERSION }}-riscv64gc-unknown-linux-gnu.tar.gz` |
            | macOS Intel | `madhyamas-oss-v${{ steps.version.outputs.VERSION }}-x86_64-apple-darwin.tar.gz` |
            | macOS Apple Silicon | `madhyamas-oss-v${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz` |
            | Windows x64 | `madhyamas-oss-v${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.zip` |
            | Windows MSI | `madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi` |

            #### Enterprise binaries

            | Platform | Download |
            |----------|----------|
            | Linux x64 | `madhyamas-enterprise-v${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux ARM64 | `madhyamas-enterprise-v${{ steps.version.outputs.VERSION }}-aarch64-unknown-linux-gnu.tar.gz` |
            | macOS Intel | `madhyamas-enterprise-v${{ steps.version.outputs.VERSION }}-x86_64-apple-darwin.tar.gz` |
            | macOS Apple Silicon | `madhyamas-enterprise-v${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz` |
            | Windows x64 | `madhyamas-enterprise-v${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.zip` |

            ### Changes

            ${{ steps.changelog.outputs.CHANGES }}

            See [CHANGELOG.md](https://github.com/ShristiLabs/madhyamas/blob/main/CHANGELOG.md) for full details.
          files: release/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}

  # =============================================================================
  # Publish to Homebrew Tap
  # Skips with visible message if HOMEBREW_TAP_TOKEN is not set
  # =============================================================================
  publish-homebrew:
    name: Publish to Homebrew Tap
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${RELEASE_VERSION:-${GITHUB_REF#refs/tags/v}}" >> $GITHUB_OUTPUT

      - name: Check for HOMEBREW_TAP_TOKEN
        id: check_token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::Skipping Homebrew tap publish — HOMEBREW_TAP_TOKEN secret is not configured. See docs/GETTING_STARTED.md for setup instructions."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Download release checksums
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          mkdir -p checksums
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            curl -sL "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/madhyamas-oss-v${{ steps.version.outputs.VERSION }}-${target}.tar.gz.sha256" -o "checksums/madhyamas-${target}.sha256" || true
          done

      - name: Update Homebrew formula (version + SHA256)
        if: steps.check_token.outputs.has_token == 'true'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for formula in packaging/homebrew/*.rb; do
            sed -i "s/version \"[^\"]*\"/version \"$VERSION\"/" "$formula"
            MACOS_INTEL_SHA=$(awk '{print $1}' checksums/madhyamas-x86_64-apple-darwin.sha256 2>/dev/null || echo "")
            MACOS_ARM_SHA=$(awk '{print $1}' checksums/madhyamas-aarch64-apple-darwin.sha256 2>/dev/null || echo "")
            LINUX_INTEL_SHA=$(awk '{print $1}' checksums/madhyamas-x86_64-unknown-linux-gnu.sha256 2>/dev/null || echo "")
            LINUX_ARM_SHA=$(awk '{print $1}' checksums/madhyamas-aarch64-unknown-linux-gnu.sha256 2>/dev/null || echo "")
            if [ -n "$MACOS_INTEL_SHA" ]; then
              sed -i "s/PLACEHOLDER_SHA256_MACOS_INTEL/$MACOS_INTEL_SHA/" "$formula"
            fi
            if [ -n "$MACOS_ARM_SHA" ]; then
              sed -i "s/PLACEHOLDER_SHA256_MACOS_ARM/$MACOS_ARM_SHA/" "$formula"
            fi
            if [ -n "$LINUX_INTEL_SHA" ]; then
              sed -i "s/PLACEHOLDER_SHA256_LINUX_INTEL/$LINUX_INTEL_SHA/" "$formula"
            fi
            if [ -n "$LINUX_ARM_SHA" ]; then
              sed -i "s/PLACEHOLDER_SHA256_LINUX_ARM/$LINUX_ARM_SHA/" "$formula"
            fi
          done

      - name: Push to Homebrew tap
        if: steps.check_token.outputs.has_token == 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Clone the homebrew-tap repo, copy the updated formula, and push
          REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO_ROOT="$GITHUB_WORKSPACE"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${REPO_OWNER}/homebrew-tap.git" /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          mkdir -p Formula
          cp "${REPO_ROOT}/packaging/homebrew/madhyamas.rb" Formula/madhyamas.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/madhyamas.rb
          git commit -m "Update madhyamas to v${{ steps.version.outputs.VERSION }}"
          # Empty repo may not have main branch yet; push to HEAD:main
          git push origin HEAD:main

  # =============================================================================
  # Publish to Chocolatey
  # Skips with visible message if CHOCOLATEY_API_KEY is not set
  # =============================================================================
  publish-chocolatey:
    name: Publish to Chocolatey
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${RELEASE_VERSION:-${GITHUB_REF#refs/tags/v}}" >> $GITHUB_OUTPUT

      - name: Check for CHOCOLATEY_API_KEY
        id: check_token
        shell: bash
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if [ -z "$CHOCOLATEY_API_KEY" ]; then
            echo "::notice::Skipping Chocolatey publish — CHOCOLATEY_API_KEY secret is not configured. See docs/GETTING_STARTED.md for setup instructions."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Download Windows zip checksum
        if: steps.check_token.outputs.has_token == 'true'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/madhyamas-oss-v${VERSION}-x86_64-pc-windows-msvc.zip.sha256" -o /tmp/win_checksum.txt
          # Extract just the hash (first field of sha256sum output)
          WIN_SHA256=$(awk '{print $1}' /tmp/win_checksum.txt)
          echo "WIN_SHA256=${WIN_SHA256}" >> $GITHUB_ENV
          echo "Windows zip SHA256: ${WIN_SHA256}"

      - name: Update Chocolatey package
        if: steps.check_token.outputs.has_token == 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $checksum = "${{ env.WIN_SHA256 }}"
          Get-ChildItem -Path "packaging/windows/chocolatey" -Recurse -Filter "*.nuspec" | ForEach-Object {
            (Get-Content $_.FullName) -replace '<version>[^<]*</version>', "<version>$version</version>" | Set-Content $_.FullName
          }
          Get-ChildItem -Path "packaging/windows/chocolatey" -Recurse -Filter "chocolateyinstall.ps1" | ForEach-Object {
            (Get-Content $_.FullName) -replace '__VERSION__', $version | Set-Content $_.FullName
            (Get-Content $_.FullName) -replace '__CHECKSUM__', $checksum | Set-Content $_.FullName
          }

      - name: Pack Chocolatey package
        if: steps.check_token.outputs.has_token == 'true'
        shell: pwsh
        run: |
          choco pack "packaging/windows/chocolatey/madhyamas/madhyamas.nuspec" --outputdirectory dist

      - name: Publish to Chocolatey
        if: steps.check_token.outputs.has_token == 'true'
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $failed = $false
          Get-ChildItem -Path "dist" -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Pushing $($_.Name) to Chocolatey..."
            $output = choco push $_.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY 2>&1
            Write-Host $output

            if ($LASTEXITCODE -ne 0) {
              $failed = $true
              if ($output -match '403') {
                Write-Host "::error::Chocolatey push returned 403 Forbidden. This usually means:"
                Write-Host "::error::  1. A previous package version is stuck in moderation with failed verification."
                Write-Host "::error::     -> Go to https://community.chocolatey.org/packages/madhyamas"
                Write-Host "::error::     -> Log in, find the failed version, and click 'Discontinue' to remove it."
                Write-Host "::error::  2. The API key is invalid or expired."
                Write-Host "::error::     -> Check your API key at https://community.chocolatey.org/account"
                Write-Host "::error::  3. The package is owned by a different account."
                Write-Host "::error::     -> Verify the 'owners' field in the nuspec matches your Chocolatey username."
                Write-Host "::error::After fixing the issue, retrigger: gh workflow run release.yml -R ${{ github.repository }} -f version=${{ steps.version.outputs.VERSION }}"
              } else {
                Write-Host "::error::Chocolatey push failed with exit code $LASTEXITCODE"
              }
            }
          }
          if ($failed) { exit 1 }

  # =============================================================================
  # Publish to Snap Store
  # Skips with visible message if SNAPCRAFT_TOKEN is not set
  # =============================================================================
  publish-snap:
    name: Publish to Snap Store
    needs: build-snap
    runs-on: ubuntu-latest
    steps:
      - name: Download Snap artifact
        uses: actions/download-artifact@v4
        with:
          name: madhyamas-snap
          path: snaps

      - name: Check for SNAPCRAFT_TOKEN
        id: check_token
        env:
          SNAPCRAFT_TOKEN: ${{ secrets.SNAPCRAFT_TOKEN }}
        run: |
          if [ -z "$SNAPCRAFT_TOKEN" ]; then
            echo "::notice::Skipping Snap Store publish — SNAPCRAFT_TOKEN secret is not configured. See docs/GETTING_STARTED.md for setup instructions."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Snap Store
        if: steps.check_token.outputs.has_token == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        run: |
          sudo snap install snapcraft --classic
          for snap_file in snaps/*.snap; do
            # snapcraft upload may return non-zero when the snap needs
            # manual review (normal for first-time uploads). We capture
            # the exit code and emit a notice rather than failing the job.
            set +e
            snapcraft upload "$snap_file" --release=stable
            EXIT_CODE=$?
            set -e
            if [ $EXIT_CODE -ne 0 ]; then
              echo "::notice::Snap upload exited with code $EXIT_CODE — the snap may require manual review on the Snap Store dashboard. This is normal for first-time uploads. See: https://snapcraft.io/madhyamas/releases"
            fi
          done

  # =============================================================================
  # Publish Docker Images — two tiers via BUILD_TIER build-arg
  # GHCR push works automatically via GITHUB_TOKEN.
  #   OSS:        ghcr.io/{org}/madhyamas:latest (and version tags)
  #   Enterprise: ghcr.io/{org}/madhyamas-enterprise:latest (and version tags)
  # Docker Hub push (OSS only) skips with visible message if DOCKERHUB_USERNAME is not set.
  # =============================================================================
  publish-docker:
    name: Publish Docker Image (${{ matrix.tier }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [oss, enterprise]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check for Docker Hub credentials
        id: check_dockerhub
        if: matrix.tier == 'oss'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::notice::Skipping Docker Hub publish — DOCKERHUB_USERNAME and/or DOCKERHUB_TOKEN secrets are not configured. GHCR push will still work. See docs/GETTING_STARTED.md for setup instructions."
            echo "has_dockerhub=false" >> $GITHUB_OUTPUT
          else
            echo "has_dockerhub=true" >> $GITHUB_OUTPUT
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (OSS only)
        if: matrix.tier == 'oss' && steps.check_dockerhub.outputs.has_dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=${RELEASE_VERSION:-${GITHUB_REF#refs/tags/v}}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "MAJOR_MINOR=$(echo $VERSION | cut -d. -f1,2)" >> $GITHUB_OUTPUT
          echo "MAJOR=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          # GHCR requires lowercase repository name
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=${REPO_LOWER}" >> $GITHUB_OUTPUT
          # Enterprise image uses a -enterprise suffix; OSS uses the base name
          if [ "${{ matrix.tier }}" = "enterprise" ]; then
            echo "IMAGE_NAME=${REPO_LOWER}-enterprise" >> $GITHUB_OUTPUT
            echo "DH_IMAGE_NAME=madhyamas-enterprise" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_NAME=${REPO_LOWER}" >> $GITHUB_OUTPUT
            echo "DH_IMAGE_NAME=madhyamas" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_TIER=${{ matrix.tier }}
          # Fetch the private licensing-core git dep with the read token.
          secrets: |
            licensing_token=${{ secrets.LICENSING_TOKEN }}
          tags: |
            ghcr.io/${{ steps.version.outputs.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.version.outputs.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ steps.version.outputs.IMAGE_NAME }}:${{ steps.version.outputs.MAJOR_MINOR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push to Docker Hub (OSS only)
        if: matrix.tier == 'oss' && steps.check_dockerhub.outputs.has_dockerhub == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_TIER=oss
          secrets: |
            licensing_token=${{ secrets.LICENSING_TOKEN }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.version.outputs.DH_IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.version.outputs.DH_IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Publish to crates.io
  # Skips with visible message if CRATES_TOKEN is not set
  # =============================================================================
  publish-crates:
    name: Publish to crates.io
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check for CRATES_TOKEN
        id: check_token
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          if [ -z "$CRATES_TOKEN" ]; then
            echo "::notice::Skipping crates.io publish — CRATES_TOKEN secret is not configured. See docs/GETTING_STARTED.md for setup instructions."
            echo "has_token=false" >> $GITHUB_OUTPUT
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish crates
        if: steps.check_token.outputs.has_token == 'true'
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          # Publish OSS crates in dependency order.
          # madhyamas-enterprise is NOT published (BSL-1.1, publish = false in Cargo.toml).
          # madhyamas-api: disable embedded-assets (requires web/dist/ which
          # doesn't exist in the published tarball)
          cargo publish -p madhyamas-core --token "$CRATES_TOKEN"
          sleep 30
          cargo publish -p madhyamas-plugin-sdk --token "$CRATES_TOKEN"
          sleep 30
          cargo publish -p madhyamas-api --no-default-features --features grpc,scripting,plugins --token "$CRATES_TOKEN"
          sleep 30
          cargo publish -p madhyamas-cli --token "$CRATES_TOKEN"
          sleep 30
          cargo publish -p madhyamas-mcp --token "$CRATES_TOKEN"
          sleep 30
          # madhyamas: embedded-assets is not in default features, so default publish is fine
          cargo publish -p madhyamas --token "$CRATES_TOKEN"

  # =============================================================================
  # SBOM generation — CycloneDX for both tiers
  # Generates a Software Bill of Materials for OSS and enterprise dependency
  # trees and attaches them to the GitHub Release.
  # =============================================================================
  generate-sbom:
    name: Generate SBOM (${{ matrix.tier }})
    needs: build-binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [oss, enterprise]
    steps:
      - uses: actions/checkout@v4
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: Extract version
        id: version
        run: echo "VERSION=${RELEASE_VERSION:-${GITHUB_REF#refs/tags/v}}" >> $GITHUB_OUTPUT

      - name: Generate SBOM (oss tier)
        if: matrix.tier == 'oss'
        run: cargo cyclonedx --no-default-features -p madhyamas --format json --output-pattern package

      - name: Generate SBOM (enterprise tier)
        if: matrix.tier == 'enterprise'
        run: cargo cyclonedx --all-features -p madhyamas --format json --output-pattern package

      - name: Rename SBOM artifact
        shell: bash
        run: |
          mkdir -p sbom
          # cargo-cyclonedx writes to target/ as madhyamas-{version}.cdx.json
          SRC=$(find target -name "madhyamas-*.cdx.json" -type f | head -1)
          if [ -n "$SRC" ]; then
            cp "$SRC" "sbom/madhyamas-${{ matrix.tier }}-v${{ steps.version.outputs.VERSION }}.cdx.json"
          else
            echo "::warning::No SBOM file generated by cargo-cyclonedx"
            exit 1
          fi

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.tier }}
          path: sbom/*.cdx.json
          retention-days: 30

  # =============================================================================
  # Attach SBOM files to the GitHub Release
  # =============================================================================
  attach-sbom:
    name: Attach SBOM to Release
    needs: [create-release, generate-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@v4
        with:
          path: sbom
          merge-multiple: true
          pattern: sbom-*

      - name: Extract version
        id: version
        run: echo "VERSION=${RELEASE_VERSION:-${GITHUB_REF#refs/tags/v}}" >> $GITHUB_OUTPUT

      - name: Attach SBOM to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          files: sbom/*.cdx.json
