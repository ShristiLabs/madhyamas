name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # =============================================================================
  # Build all binaries for all platforms
  # =============================================================================
  build-binaries:
    name: Build ${{ matrix.package }} for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Madhyamas Main (with web UI) - Linux
          - package: madhyamas
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            build_web: true
          - package: madhyamas
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            build_web: true
            cross: true
          # Madhyamas Main - macOS
          - package: madhyamas
            target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
            build_web: true
          - package: madhyamas
            target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            build_web: true
          # Madhyamas Main - Windows
          - package: madhyamas
            target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            build_web: true

          # Madhyamas CLI - Linux
          - package: madhyamas-cli
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            build_web: false
          - package: madhyamas-cli
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            build_web: false
            cross: true
          # Madhyamas CLI - macOS
          - package: madhyamas-cli
            target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
            build_web: false
          - package: madhyamas-cli
            target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            build_web: false
          # Madhyamas CLI - Windows
          - package: madhyamas-cli
            target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            build_web: false

          # Madhyamas MCP - Linux
          - package: madhyamas-mcp
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            build_web: false
          - package: madhyamas-mcp
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            build_web: false
            cross: true
          # Madhyamas MCP - macOS
          - package: madhyamas-mcp
            target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
            build_web: false
          - package: madhyamas-mcp
            target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            build_web: false
          # Madhyamas MCP - Windows
          - package: madhyamas-mcp
            target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            build_web: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ matrix.package }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-${{ matrix.package }}-cargo-

      - name: Setup Node.js
        if: matrix.build_web
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        if: matrix.build_web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.package }}

      - name: Determine binary name
        id: binary
        shell: bash
        run: |
          if [ "${{ matrix.package }}" = "madhyamas" ]; then
            echo "NAME=madhyamas" >> $GITHUB_OUTPUT
          else
            echo "NAME=${{ matrix.package }}" >> $GITHUB_OUTPUT
          fi

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARTIFACT_NAME="${{ matrix.package }}-v${{ steps.version.outputs.VERSION }}-${{ matrix.target }}"
          mkdir -p dist/$ARTIFACT_NAME

          # Copy binary
          cp target/${{ matrix.target }}/release/${{ steps.binary.outputs.NAME }} dist/$ARTIFACT_NAME/

          # Copy web assets for main package
          if [ "${{ matrix.build_web }}" = "true" ]; then
            cp -r web/dist dist/$ARTIFACT_NAME/web
          fi

          # Create archive
          cd dist
          tar -czvf $ARTIFACT_NAME.tar.gz $ARTIFACT_NAME

          # Generate checksum
          sha256sum $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ARTIFACT_NAME = "${{ matrix.package }}-v${{ steps.version.outputs.VERSION }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist\$ARTIFACT_NAME" -Force

          # Copy binary
          Copy-Item "target\${{ matrix.target }}\release\${{ steps.binary.outputs.NAME }}.exe" "dist\$ARTIFACT_NAME\"

          # Copy web assets for main package
          if ("${{ matrix.build_web }}" -eq "true") {
            Copy-Item -Recurse "web\dist" "dist\$ARTIFACT_NAME\web"
          }

          # Create archive
          cd dist
          7z a "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME"

          # Generate checksum
          $hash = Get-FileHash "$ARTIFACT_NAME.zip" -Algorithm SHA256
          "$($hash.Hash)  $ARTIFACT_NAME.zip" | Out-File "$ARTIFACT_NAME.zip.sha256" -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: dist/${{ matrix.package }}-v*.*

  # =============================================================================
  # Build Windows MSI Installer
  # =============================================================================
  build-msi:
    name: Build Windows MSI Installer
    needs: build-binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-x86_64-pc-windows-msvc"
          path: artifacts

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix

      - name: Prepare MSI source files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "msi-source\bin" -Force

          # Extract all packages
          $artifacts = Get-ChildItem -Path "artifacts" -Recurse -Filter "*.zip"
          foreach ($artifact in $artifacts) {
            7z x $artifact.FullName -o"temp" -y
          }

          # Copy binaries
          Copy-Item "temp\madhyamas-*\madhyamas.exe" "msi-source\bin\" -ErrorAction SilentlyContinue
          Copy-Item "temp\madhyamas-cli-*\madhyamas-cli.exe" "msi-source\bin\" -ErrorAction SilentlyContinue
          Copy-Item "temp\madhyamas-mcp-*\madhyamas-mcp.exe" "msi-source\bin\" -ErrorAction SilentlyContinue

          # Copy web assets
          if (Test-Path "temp\madhyamas-*\web") {
            Copy-Item -Recurse "temp\madhyamas-*\web" "msi-source\"
          }

      - name: Build MSI
        shell: pwsh
        working-directory: packaging/windows/msi
        run: |
          wix build madhyamas.wxs -d SourceDir="../../../msi-source" -d Version="${{ steps.version.outputs.VERSION }}" -o "../../../dist/madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi"

      - name: Generate MSI checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash "dist\madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi" -Algorithm SHA256
          "$($hash.Hash)  madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi" | Out-File "dist\madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi.sha256" -Encoding ASCII

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-msi
          path: dist/madhyamas-v*.msi*

  # =============================================================================
  # Build Snap packages
  # =============================================================================
  build-snap:
    name: Build Snap Package (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [madhyamas, madhyamas-cli, madhyamas-mcp]
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Select snapcraft file
        run: |
          if [ "${{ matrix.package }}" = "madhyamas" ]; then
            cp packaging/linux/snap/snapcraft.yaml snap/snapcraft.yaml
          else
            cp packaging/linux/snap/${{ matrix.package }}.snapcraft.yaml snap/snapcraft.yaml
          fi
          mkdir -p snap

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Rename snap file
        run: |
          mv ${{ steps.snapcraft.outputs.snap }} ${{ matrix.package }}-v${{ steps.version.outputs.VERSION }}.snap

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-snap
          path: ${{ matrix.package }}-v*.snap

  # =============================================================================
  # Build RPM packages
  # =============================================================================
  build-rpm:
    name: Build RPM Package (${{ matrix.package }})
    runs-on: ubuntu-latest
    container: fedora:latest
    strategy:
      matrix:
        package: [madhyamas, madhyamas-cli, madhyamas-mcp]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools rust cargo openssl-devel gcc
          if [ "${{ matrix.package }}" = "madhyamas" ]; then
            dnf install -y nodejs npm
          fi

      - name: Setup RPM build environment
        run: rpmdev-setuptree

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Copy spec file
        run: |
          cp packaging/linux/rpm/${{ matrix.package }}.spec ~/rpmbuild/SPECS/
          if [ -f packaging/linux/rpm/madhyamas.service ]; then
            cp packaging/linux/rpm/madhyamas.service ~/rpmbuild/SOURCES/
          fi

      - name: Create source tarball
        run: |
          tar -czvf ~/rpmbuild/SOURCES/v${{ steps.version.outputs.VERSION }}.tar.gz \
            --transform "s,^,madhyamas-${{ steps.version.outputs.VERSION }}/," \
            --exclude='.git' --exclude='target' --exclude='node_modules' .

      - name: Build RPM
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/${{ matrix.package }}.spec

      - name: Copy RPM to dist
        run: |
          mkdir -p dist
          cp ~/rpmbuild/RPMS/*/*.rpm dist/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-rpm
          path: dist/*.rpm

  # =============================================================================
  # Create GitHub Release
  # =============================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-msi, build-snap, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: find artifacts -type f | head -100

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.msi" -o -name "*.snap" -o -name "*.rpm" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Madhyamas v${{ steps.version.outputs.VERSION }}
          body: |
            ## Madhyamas v${{ steps.version.outputs.VERSION }}

            ### Installation

            #### macOS (Homebrew)
            ```bash
            brew tap madhyamas/tap
            brew install madhyamas
            brew install madhyamas-cli  # Optional CLI
            brew install madhyamas-mcp  # Optional MCP server
            ```

            #### Windows (Chocolatey)
            ```powershell
            choco install madhyamas
            ```

            #### Windows (MSI Installer)
            Download `madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi`

            #### Linux (Snap)
            ```bash
            sudo snap install madhyamas
            ```

            #### Linux (DNF/YUM)
            ```bash
            sudo dnf install ./madhyamas-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm
            ```

            ### Downloads

            #### Madhyamas (Main Server + Web UI)
            | Platform | Download |
            |----------|----------|
            | Linux x64 | `madhyamas-v${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux ARM64 | `madhyamas-v${{ steps.version.outputs.VERSION }}-aarch64-unknown-linux-gnu.tar.gz` |
            | macOS Intel | `madhyamas-v${{ steps.version.outputs.VERSION }}-x86_64-apple-darwin.tar.gz` |
            | macOS Apple Silicon | `madhyamas-v${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz` |
            | Windows x64 | `madhyamas-v${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.zip` |
            | Windows MSI | `madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi` |

            #### Madhyamas CLI
            | Platform | Download |
            |----------|----------|
            | Linux x64 | `madhyamas-cli-v${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz` |
            | macOS Intel | `madhyamas-cli-v${{ steps.version.outputs.VERSION }}-x86_64-apple-darwin.tar.gz` |
            | macOS Apple Silicon | `madhyamas-cli-v${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz` |
            | Windows x64 | `madhyamas-cli-v${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.zip` |

            #### Madhyamas MCP Server
            | Platform | Download |
            |----------|----------|
            | Linux x64 | `madhyamas-mcp-v${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz` |
            | macOS Intel | `madhyamas-mcp-v${{ steps.version.outputs.VERSION }}-x86_64-apple-darwin.tar.gz` |
            | macOS Apple Silicon | `madhyamas-mcp-v${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz` |
            | Windows x64 | `madhyamas-mcp-v${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.zip` |

            ### Quick Start
            ```bash
            # Extract and run
            tar -xzf madhyamas-v${{ steps.version.outputs.VERSION }}-*.tar.gz
            cd madhyamas-v${{ steps.version.outputs.VERSION }}-*/
            ./madhyamas start

            # Web UI: http://localhost:3000
            # Proxy: localhost:8888
            ```

            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: release/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}

  # =============================================================================
  # Publish to Package Managers
  # =============================================================================
  publish-homebrew:
    name: Update Homebrew Tap
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download release checksums
        run: |
          mkdir -p checksums
          for pkg in madhyamas madhyamas-cli madhyamas-mcp; do
            for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
              curl -sL "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/${pkg}-v${{ steps.version.outputs.VERSION }}-${target}.tar.gz.sha256" -o "checksums/${pkg}-${target}.sha256" || true
            done
          done

      - name: Update Homebrew formulas
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Update version in formulas
          for formula in packaging/homebrew/*.rb; do
            sed -i "s/version \"[^\"]*\"/version \"$VERSION\"/" "$formula"
          done

          # Update checksums (read from downloaded files)
          # This is a placeholder - actual implementation would parse sha256 files

      - name: Push to Homebrew tap
        if: github.repository == 'madhyamas/madhyamas'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          echo "Would push updated formulas to homebrew-tap repository"
          # git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/madhyamas/homebrew-tap.git
          # cp packaging/homebrew/*.rb homebrew-tap/Formula/
          # cd homebrew-tap && git add . && git commit -m "Update to v${{ steps.version.outputs.VERSION }}" && git push

  publish-chocolatey:
    name: Publish to Chocolatey
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download Windows artifacts
        run: |
          mkdir -p artifacts
          $packages = @("madhyamas", "madhyamas-cli", "madhyamas-mcp")
          foreach ($pkg in $packages) {
            $url = "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/${pkg}-v${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.zip.sha256"
            Invoke-WebRequest -Uri $url -OutFile "artifacts/${pkg}.sha256" -ErrorAction SilentlyContinue
          }

      - name: Update Chocolatey packages
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"

          # Update nuspec versions
          Get-ChildItem -Path "packaging/windows/chocolatey" -Recurse -Filter "*.nuspec" | ForEach-Object {
            (Get-Content $_.FullName) -replace '<version>[^<]*</version>', "<version>$version</version>" | Set-Content $_.FullName
          }

          # Update install script URLs and checksums
          Get-ChildItem -Path "packaging/windows/chocolatey" -Recurse -Filter "chocolateyinstall.ps1" | ForEach-Object {
            (Get-Content $_.FullName) -replace '__VERSION__', $version | Set-Content $_.FullName
          }

      - name: Pack Chocolatey packages
        shell: pwsh
        run: |
          $packages = @("madhyamas", "madhyamas-cli", "madhyamas-mcp")
          foreach ($pkg in $packages) {
            choco pack "packaging/windows/chocolatey/$pkg/$pkg.nuspec" --outputdirectory dist
          }

      - name: Publish to Chocolatey
        if: github.repository == 'madhyamas/madhyamas'
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "dist" -Filter "*.nupkg" | ForEach-Object {
            choco push $_.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          }

  publish-snap:
    name: Publish to Snap Store
    needs: build-snap
    runs-on: ubuntu-latest
    steps:
      - name: Download Snap artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-snap"
          path: snaps

      - name: Publish to Snap Store
        if: github.repository == 'madhyamas/madhyamas'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        run: |
          sudo snap install snapcraft --classic
          find snaps -name "*.snap" -exec snapcraft upload {} --release=stable \;

  publish-docker:
    name: Publish Docker Image
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.repository == 'madhyamas/madhyamas'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "MAJOR_MINOR=$(echo $VERSION | cut -d. -f1,2)" >> $GITHUB_OUTPUT
          echo "MAJOR=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.MAJOR_MINOR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-crates:
    name: Publish to crates.io
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates
        if: github.repository == 'madhyamas/madhyamas'
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          # Publish in dependency order
          cargo publish -p madhyamas-core --token $CRATES_TOKEN || true
          sleep 30
          cargo publish -p madhyamas-api --token $CRATES_TOKEN || true
          sleep 30
          cargo publish -p madhyamas-cli --token $CRATES_TOKEN || true
          cargo publish -p madhyamas-mcp --token $CRATES_TOKEN || true
