name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # =============================================================================
  # Build frontend once — shared across all downstream jobs via artifact
  # =============================================================================
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build frontend (full — with tsc type-check)
        working-directory: web
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 3

  # =============================================================================
  # Test gate — run tests before any build/publish steps
  # =============================================================================
  test-gate:
    name: Test Gate
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: test-gate

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --verbose

  # =============================================================================
  # Build the unified binary for all platforms
  # Single binary includes: proxy server + web UI (embedded) + MCP + CLI
  # =============================================================================
  build-binaries:
    needs: test-gate
    name: Build madhyamas for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: aarch64
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: armv7
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: armv6
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
            cross_arch: riscv64
          # macOS
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          if [ "${{ matrix.cross_arch }}" = "armv7" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.cross_arch }}" = "armv6" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
            echo "CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.cross_arch }}" = "riscv64" ]; then
            sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
            echo "CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc" >> $GITHUB_ENV
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} -p madhyamas

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ARTIFACT_NAME="madhyamas-v${{ steps.version.outputs.VERSION }}-${{ matrix.target }}"
          mkdir -p dist/$ARTIFACT_NAME
          cp target/${{ matrix.target }}/release/madhyamas dist/$ARTIFACT_NAME/
          cd dist
          tar -czvf $ARTIFACT_NAME.tar.gz $ARTIFACT_NAME
          if command -v sha256sum &> /dev/null; then
            sha256sum $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256
          else
            shasum -a 256 $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ARTIFACT_NAME = "madhyamas-v${{ steps.version.outputs.VERSION }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist\$ARTIFACT_NAME" -Force
          Copy-Item "target\${{ matrix.target }}\release\madhyamas.exe" "dist\$ARTIFACT_NAME\"
          cd dist
          7z a "$ARTIFACT_NAME.zip" "$ARTIFACT_NAME"
          $hash = Get-FileHash "$ARTIFACT_NAME.zip" -Algorithm SHA256
          "$($hash.Hash)  $ARTIFACT_NAME.zip" | Out-File "$ARTIFACT_NAME.zip.sha256" -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-${{ matrix.target }}
          path: dist/madhyamas-v*.*

  # =============================================================================
  # Build Windows MSI Installer
  # =============================================================================
  build-msi:
    name: Build Windows MSI Installer
    needs: build-binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: madhyamas-x86_64-pc-windows-msvc
          path: artifacts

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Prepare MSI source files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "msi-source\bin" -Force
          $artifacts = Get-ChildItem -Path "artifacts" -Recurse -Filter "*.zip"
          foreach ($artifact in $artifacts) {
            7z x $artifact.FullName -o"temp" -y
          }
          Copy-Item "temp\madhyamas-*\madhyamas.exe" "msi-source\bin\" -ErrorAction SilentlyContinue

      - name: Build MSI
        shell: pwsh
        working-directory: packaging/windows/msi
        run: |
          wix build madhyamas.wxs -d SourceDir="../../../msi-source" -d Version="${{ steps.version.outputs.VERSION }}" -o "../../../dist/madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi"

      - name: Generate MSI checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash "dist\madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi" -Algorithm SHA256
          "$($hash.Hash)  madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi" | Out-File "dist\madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi.sha256" -Encoding ASCII

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-msi
          path: dist/madhyamas-v*.msi*

  # =============================================================================
  # Build Snap package
  # =============================================================================
  build-snap:
    name: Build Snap Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Copy snapcraft file
        run: |
          cp packaging/linux/snap/snapcraft.yaml snap/snapcraft.yaml
          mkdir -p snap

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Rename snap file
        run: |
          mv ${{ steps.snapcraft.outputs.snap }} madhyamas-v${{ steps.version.outputs.VERSION }}.snap

      - name: Upload Snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-snap
          path: madhyamas-v*.snap

  # =============================================================================
  # Build RPM package
  # =============================================================================
  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools rust cargo openssl-devel gcc nodejs npm

      - name: Build frontend (skip tsc — already checked in test-gate)
        working-directory: web
        run: |
          npm ci
          npm run build:fast

      - name: Setup RPM build environment
        run: rpmdev-setuptree

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Copy spec file
        run: |
          cp packaging/linux/rpm/madhyamas.spec ~/rpmbuild/SPECS/
          if [ -f packaging/linux/rpm/madhyamas.service ]; then
            cp packaging/linux/rpm/madhyamas.service ~/rpmbuild/SOURCES/
          fi

      - name: Create source tarball
        run: |
          tar -czvf ~/rpmbuild/SOURCES/v${{ steps.version.outputs.VERSION }}.tar.gz \
            --transform "s,^,madhyamas-${{ steps.version.outputs.VERSION }}/," \
            --exclude='.git' --exclude='target' --exclude='node_modules' .

      - name: Build RPM
        run: rpmbuild -ba ~/rpmbuild/SPECS/madhyamas.spec

      - name: Copy RPM to dist
        run: |
          mkdir -p dist
          cp ~/rpmbuild/RPMS/*/*.rpm dist/

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-rpm
          path: dist/*.rpm

  # =============================================================================
  # Create GitHub Release
  # =============================================================================
  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-msi, build-snap, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.msi" -o -name "*.snap" -o -name "*.rpm" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Madhyamas v${{ steps.version.outputs.VERSION }}
          body: |
            ## Madhyamas v${{ steps.version.outputs.VERSION }}

            **Single unified binary** — proxy server, web UI, MCP server, and CLI in one executable.
            Web UI assets are embedded in the binary — no external files needed.

            ### Installation

            #### macOS (Homebrew)
            ```bash
            brew tap madhyamas/tap
            brew install madhyamas
            ```

            #### Windows (Chocolatey)
            ```powershell
            choco install madhyamas
            ```

            #### Windows (MSI Installer)
            Download `madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi`

            #### Linux (Snap)
            ```bash
            sudo snap install madhyamas
            ```

            #### Linux (DNF/YUM)
            ```bash
            sudo dnf install ./madhyamas-${{ steps.version.outputs.VERSION }}-1.x86_64.rpm
            ```

            ### Usage

            ```bash
            # Start proxy server with web UI (default)
            ./madhyamas
            # or: ./madhyamas serve

            # Web UI: http://localhost:3001
            # Proxy:  localhost:8888

            # Run as MCP server (stdio transport)
            ./madhyamas mcp

            # CLI commands
            ./madhyamas traffic list
            ./madhyamas mocks list
            ./madhyamas breakpoints list
            ./madhyamas sessions list
            ./madhyamas throttle get
            # ... and more (run ./madhyamas --help)
            ```

            ### Downloads

            | Platform | Download |
            |----------|----------|
            | Linux x64 | `madhyamas-v${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz` |
            | Linux ARM64 | `madhyamas-v${{ steps.version.outputs.VERSION }}-aarch64-unknown-linux-gnu.tar.gz` |
            | Linux ARMv7 (Pi 2/3/4 32-bit) | `madhyamas-v${{ steps.version.outputs.VERSION }}-armv7-unknown-linux-gnueabihf.tar.gz` |
            | Linux ARMv6 (Pi 1/Zero 32-bit) | `madhyamas-v${{ steps.version.outputs.VERSION }}-arm-unknown-linux-gnueabihf.tar.gz` |
            | Linux RISC-V 64 | `madhyamas-v${{ steps.version.outputs.VERSION }}-riscv64gc-unknown-linux-gnu.tar.gz` |
            | macOS Intel | `madhyamas-v${{ steps.version.outputs.VERSION }}-x86_64-apple-darwin.tar.gz` |
            | macOS Apple Silicon | `madhyamas-v${{ steps.version.outputs.VERSION }}-aarch64-apple-darwin.tar.gz` |
            | Windows x64 | `madhyamas-v${{ steps.version.outputs.VERSION }}-x86_64-pc-windows-msvc.zip` |
            | Windows MSI | `madhyamas-v${{ steps.version.outputs.VERSION }}-x64.msi` |

            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: release/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}

  # =============================================================================
  # Publish to Package Managers
  # =============================================================================
  publish-homebrew:
    name: Update Homebrew Tap
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download release checksums
        run: |
          mkdir -p checksums
          for target in x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            curl -sL "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/madhyamas-v${{ steps.version.outputs.VERSION }}-${target}.tar.gz.sha256" -o "checksums/madhyamas-${target}.sha256" || true
          done

      - name: Update Homebrew formula (version + SHA256)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          for formula in packaging/homebrew/*.rb; do
            sed -i "s/version \"[^\"]*\"/version \"$VERSION\"/" "$formula"
            MACOS_INTEL_SHA=$(awk '{print $1}' checksums/madhyamas-x86_64-apple-darwin.sha256 2>/dev/null || echo "")
            MACOS_ARM_SHA=$(awk '{print $1}' checksums/madhyamas-aarch64-apple-darwin.sha256 2>/dev/null || echo "")
            if [ -n "$MACOS_INTEL_SHA" ]; then
              sed -i "s/PLACEHOLDER_SHA256_MACOS_INTEL/$MACOS_INTEL_SHA/" "$formula"
            fi
            if [ -n "$MACOS_ARM_SHA" ]; then
              sed -i "s/PLACEHOLDER_SHA256_MACOS_ARM/$MACOS_ARM_SHA/" "$formula"
            fi
          done

      - name: Push to Homebrew tap
        if: github.repository == 'ShristiLabs/madhyamas'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          echo "Would push updated formulas to homebrew-tap repository"

  publish-chocolatey:
    name: Publish to Chocolatey
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update Chocolatey package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          Get-ChildItem -Path "packaging/windows/chocolatey" -Recurse -Filter "*.nuspec" | ForEach-Object {
            (Get-Content $_.FullName) -replace '<version>[^<]*</version>', "<version>$version</version>" | Set-Content $_.FullName
          }
          Get-ChildItem -Path "packaging/windows/chocolatey" -Recurse -Filter "chocolateyinstall.ps1" | ForEach-Object {
            (Get-Content $_.FullName) -replace '__VERSION__', $version | Set-Content $_.FullName
          }

      - name: Pack Chocolatey package
        shell: pwsh
        run: |
          choco pack "packaging/windows/chocolatey/madhyamas/madhyamas.nuspec" --outputdirectory dist

      - name: Publish to Chocolatey
        if: github.repository == 'ShristiLabs/madhyamas'
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        shell: pwsh
        run: |
          Get-ChildItem -Path "dist" -Filter "*.nupkg" | ForEach-Object {
            choco push $_.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
          }

  publish-snap:
    name: Publish to Snap Store
    needs: build-snap
    runs-on: ubuntu-latest
    steps:
      - name: Download Snap artifact
        uses: actions/download-artifact@v4
        with:
          name: madhyamas-snap
          path: snaps

      - name: Publish to Snap Store
        if: github.repository == 'ShristiLabs/madhyamas'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        run: |
          sudo snap install snapcraft --classic
          find snaps -name "*.snap" -exec snapcraft upload {} --release=stable \;

  publish-docker:
    name: Publish Docker Image
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.repository == 'ShristiLabs/madhyamas'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "MAJOR_MINOR=$(echo $VERSION | cut -d. -f1,2)" >> $GITHUB_OUTPUT
          echo "MAJOR=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.MAJOR_MINOR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-crates:
    name: Publish to crates.io
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates
        if: github.repository == 'ShristiLabs/madhyamas'
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          # Publish in dependency order
          cargo publish -p madhyamas-core --token $CRATES_TOKEN || true
          sleep 30
          cargo publish -p madhyamas-api --token $CRATES_TOKEN || true
          sleep 30
          cargo publish -p madhyamas-cli --token $CRATES_TOKEN || true
          sleep 30
          cargo publish -p madhyamas-mcp --token $CRATES_TOKEN || true
          sleep 30
          cargo publish -p madhyamas --token $CRATES_TOKEN || true
