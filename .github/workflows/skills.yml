name: Skills Build & Validate

on:
  push:
    paths:
      - 'skills/**'
      - '.github/workflows/skills.yml'
  pull_request:
    paths:
      - 'skills/**'
      - '.github/workflows/skills.yml'

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x skills/madhyamas/scripts/*.sh

      - name: Validate skill structure
        run: bash skills/madhyamas/scripts/validate.sh

      - name: Check SKILL.md line count
        run: |
          lines=$(wc -l < skills/madhyamas/SKILL.md)
          if [ "$lines" -gt 500 ]; then
            echo "::error::SKILL.md is $lines lines (must be under 500)"
            exit 1
          fi
          echo "SKILL.md is $lines lines"

      - name: Check for broken reference links
        run: |
          cd skills/madhyamas
          grep -oP 'references/[a-z-]+\.md' SKILL.md | sort -u | while read ref; do
            if [ ! -f "$ref" ]; then
              echo "::error::Broken link: $ref"
              exit 1
            fi
          done
          echo "All reference links valid"

      - name: Check no emojis in markdown
        run: |
          if grep -rP '[\x{1F300}-\x{1F9FF}]' skills/madhyamas/ --include="*.md"; then
            echo "::error::Emojis found in markdown files"
            exit 1
          fi
          echo "No emojis found"

  build:
    name: Build All Targets
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x skills/madhyamas/scripts/*.sh

      - name: Build skills for all targets
        run: bash skills/madhyamas/scripts/build.sh

      - name: Verify dist directory
        run: |
          echo "Generated files:"
          find dist/ -type f | sort

          # Verify key outputs exist
          for f in \
            dist/agents/madhyamas/SKILL.md \
            dist/claude/madhyamas/SKILL.md \
            dist/devin/madhyamas/SKILL.md \
            dist/windsurf-skills/madhyamas/SKILL.md \
            dist/windsurf-rules/madhyamas.md \
            dist/cursor/madhyamas.mdc \
            dist/opencode/madhyamas/SKILL.md \
            dist/commandcode/madhyamas/SKILL.md \
            dist/madhyamas.skill \
            dist/madhyamas-skill.zip; do
            if [ ! -e "$f" ]; then
              echo "::error::Missing build output: $f"
              exit 1
            fi
          done
          echo "All build outputs verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-skills
          path: dist/
          retention-days: 30

  test-install:
    name: Test Installation
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        target: [claude, devin, windsurf, cursor, opencode, commandcode, agents]
    steps:
      - uses: actions/checkout@v4

      # Reuse the `build` job's artifact instead of rebuilding per target —
      # install.sh reads from the repo-root dist/ directory, which the
      # artifact (uploaded from dist/) recreates here.
      - name: Download built skills
        uses: actions/download-artifact@v4
        with:
          name: madhyamas-skills
          path: dist

      - name: Test install to ${{ matrix.target }}
        run: |
          bash skills/madhyamas/scripts/install.sh ${{ matrix.target }}
          echo "Installation test passed for ${{ matrix.target }}"
