name: Docs

# Split from ci.yml so documentation edits check docs (broken links, stale
# source paths, module coverage) without triggering the full Rust/Docker/
# binary matrix.

on:
  push:
    branches: [main, develop]
    paths:
      # Docs edits (the point of the split: no heavy matrix for these)
      - "docs/**"
      # check-docs.sh verifies source paths referenced FROM docs, and
      # check-docs-coverage.sh scans crates/madhyamas-core/src — so source
      # changes must still run this cheap job.
      - "crates/**"
      - "web/**"
      - "scripts/check-docs*.sh"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "crates/**"
      - "web/**"
      - "scripts/check-docs*.sh"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

jobs:
  docs-check:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links and source path references
        run: bash scripts/check-docs.sh
      - name: Check module documentation coverage
        run: bash scripts/check-docs-coverage.sh

  docs-site-check:
    name: Docs site versioned build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress lastUpdated timestamps need git history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci
      - name: Check versioned build layout, latest alias, and switcher links
        working-directory: docs-site
        run: ./scripts/check-versioned-build.sh
