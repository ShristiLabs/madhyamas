name: Deploy Documentation

# Versioned docs deployment. See docs-site/VERSIONING.md for the full design.
#
# - Push to main touching docs-site/** -> rebuild SNAPSHOT/ (release version
#   directories are preserved).
# - Push of a v* tag -> builds vX.Y.Z/ and refreshes latest/ + root redirect.
# - workflow_dispatch with docs_version -> backport rebuild if that version
#   was already published (run from a release branch holding cherry-picked
#   doc fixes), or a first-time release build (+ latest/ + root redirect) if
#   it was never published — e.g. a release tag cut before this versioning
#   system existed. Mode is decided AFTER recovering the prior artifact, by
#   checking whether the version directory is actually present.
#
# Version preservation: GitHub Pages replaces the whole site on every deploy,
# so this workflow chains artifacts — it downloads the `github-pages` artifact
# from the last successful run of this workflow, overlays the newly built
# version tree(s) into it, and re-uploads. No persistent docs branch is used.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "docs-site/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:
    inputs:
      docs_version:
        description: "Release version to rebuild (e.g. v0.1.6). Empty = SNAPSHOT. Run from main for SNAPSHOT, or from a release branch for a backport."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  # Serialized so artifact chaining cannot race two deploys against each other.
  group: "deploy-docs"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so VitePress `lastUpdated` timestamps are correct.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Recover previously published versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Chain from the last successful deploy of this workflow: its
          # `github-pages` artifact contains the full multi-version site.
          # The unpacked tar becomes the staging root that the build script
          # overlays the new version tree into, so all other version
          # directories survive this deploy.
          mkdir -p docs-site/.vitepress/staging
          run_id="$(gh run list --workflow deploy-docs.yml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            echo "Recovering site from run $run_id"
            if gh run download "$run_id" --name github-pages --dir prior-site; then
              tar -xf prior-site/artifact.tar -C docs-site/.vitepress/staging
              echo "Recovered versions:"
              ls docs-site/.vitepress/staging
            else
              echo "No downloadable github-pages artifact in run $run_id; starting from a clean site"
            fi
          else
            echo "No prior successful deploy found; starting from a clean site"
          fi
          rm -rf prior-site

      - name: Determine mode
        id: mode
        env:
          DOCS_VERSION_INPUT: ${{ inputs.docs_version }}
        run: |
          if [ -n "$DOCS_VERSION_INPUT" ]; then
            echo "version=$DOCS_VERSION_INPUT" >> "$GITHUB_OUTPUT"
            if [ -d "docs-site/.vitepress/staging/$DOCS_VERSION_INPUT" ]; then
              # Already published: a true backport, rebuilding in place.
              echo "mode=backport" >> "$GITHUB_OUTPUT"
            else
              # Never published (e.g. a release tag cut before this
              # versioning system existed) -- build it fresh and refresh
              # latest/ + the root redirect, same as a real release deploy.
              echo "mode=release" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=snapshot" >> "$GITHUB_OUTPUT"
            echo "version=SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Build versioned docs
        working-directory: docs-site
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          VERSION: ${{ steps.mode.outputs.version }}
        run: |
          case "$MODE" in
            snapshot) ./scripts/build-versioned.sh snapshot --ci ;;
            release)  ./scripts/build-versioned.sh release "$VERSION" --ci ;;
            backport) ./scripts/build-versioned.sh backport "$VERSION" --ci ;;
          esac

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # upload-pages-artifact tars the directory itself; pass the staging
      # root (the full multi-version site) directly.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/.vitepress/staging

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
