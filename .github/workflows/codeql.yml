name: CodeQL Security Analysis

on:
  push:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/codeql.yml"
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Skip PR runs for Dependabot: secrets (LICENSING_TOKEN) are withheld
    # in that context, so the Rust autobuild cannot fetch licensing-core.
    # Dependency bumps are still analyzed post-merge (push) and weekly.
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['rust', 'javascript-typescript']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Without repo access, Rust autobuild cannot fetch the private
      # licensing-core dependency and the analysis extracts almost nothing.
      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Rust cache
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@v2
        with:
          key: codeql-${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
