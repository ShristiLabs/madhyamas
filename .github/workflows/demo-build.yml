# Demo artifact build — on-demand, no release.
#
# Builds the enterprise-tier unified binary with the embedded web UI for
# Linux ARM64 and x86-64 and uploads each as a workflow artifact (default
# 7-day retention). Used to provision demo hosts (OrangePi, Hetzner CX,
# ...) without cutting a versioned release — the same recipe as
# release.yml's build-binaries job, enterprise tier only.
#
# Run: Actions -> "Demo Build (enterprise)" -> Run workflow,
#   or: gh workflow run demo-build.yml
# Fetch: gh run download <run-id> \
#   -n madhyamas-enterprise-demo-<target>

name: Demo Build (enterprise)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  demo-build:
    name: Enterprise demo artifact (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Configure private licensing repo access
        uses: ./.github/actions/configure-licensing-repo
        with:
          token: ${{ secrets.LICENSING_TOKEN }}

      # --- Frontend (web/dist is embedded into the binary by rust-embed) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      # --- Rust toolchain (aarch64 cross-compiles; x86_64 is native) ---
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-enterprise-demo

      - name: Build binary (enterprise tier)
        run: cargo build --release --target ${{ matrix.target }} -p madhyamas --features embedded-assets --locked

      - name: Package
        run: |
          ARTIFACT_NAME="madhyamas-enterprise-demo-${{ matrix.target }}"
          mkdir -p dist/$ARTIFACT_NAME
          cp target/${{ matrix.target }}/release/madhyamas dist/$ARTIFACT_NAME/
          cd dist
          tar -czvf $ARTIFACT_NAME.tar.gz $ARTIFACT_NAME
          sha256sum $ARTIFACT_NAME.tar.gz > $ARTIFACT_NAME.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: madhyamas-enterprise-demo-${{ matrix.target }}
          path: dist/madhyamas-enterprise-demo-${{ matrix.target }}.tar.gz*
          retention-days: 7
