name: Madhyamas
options:
  bundleIdPrefix: com.madhyamas
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  MadhyamasCore:
    path: Core

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""

targets:
  MadhyamasiOS:
    type: application
    platform: iOS
    sources:
      - MadhyamasiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madhyamas.ios
    dependencies:
      - package: MadhyamasCore
      - target: MadhyamasTunnel
    info:
      path: MadhyamasiOS/Info.plist
      properties:
        CFBundleDisplayName: Madhyamas
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.madhyamas.connect
            CFBundleURLSchemes:
              - madhyamas
    entitlements:
      path: MadhyamasiOS/MadhyamasiOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.madhyamas.shared
        com.apple.developer.networking.network-extension:
          - app-proxy-provider
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.madhyamas.shared"

  MadhyamasTunnel:
    type: app-extension
    platform: iOS
    sources:
      - Tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.madhyamas.ios.tunnel
    dependencies:
      - package: MadhyamasCore
    info:
      path: Tunnel/Info.plist
      properties:
        CFBundleDisplayName: Madhyamas Tunnel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.app-proxy
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MadhyamasProxyProvider
    entitlements:
      path: Tunnel/Tunnel.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.madhyamas.shared
        com.apple.developer.networking.network-extension:
          - app-proxy-provider
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.madhyamas.shared"

schemes:
  MadhyamasiOS:
    build:
      targets:
        MadhyamasiOS: all
    run:
      config: Debug
