upstream madhyamas_backend {
    # Round-robin load balancing across both Madhyamas instances.
    # Sticky sessions (ip_hash) are recommended for WebSocket persistence.
    ip_hash;
    server madhyamas-1:3001;
    server madhyamas-2:3001;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://madhyamas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
