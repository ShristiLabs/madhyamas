# nginx stream config for the HTTP/HTTPS proxy port (8888).
# This is a raw TCP load balancer — it forwards connections to the
# Madhyamas proxy instances without inspecting HTTP headers (the proxy
# instances handle the MITM/TLS themselves).
#
# This file is mounted at /etc/nginx/stream.d/proxy.conf inside the
# nginx container. The main nginx.conf must include /etc/nginx/stream.d/*.conf
# inside a stream block. The default nginx:alpine image does NOT include
# stream.d by default, so we also mount a custom nginx.conf.

upstream proxy_backend {
    server madhyamas-1:8888;
    server madhyamas-2:8888;
}

server {
    listen 8888;
    proxy_pass proxy_backend;
}
