# Docker Compose for local multi-instance testing (Phase 6d).
#
# Runs two Madhyamas instances sharing the same PostgreSQL + Redis,
# plus an nginx load balancer for round-robin distribution.
#
# Usage:
#   docker compose -f docker/docker-compose.multi.yml up
#
# The Madhyamas instances are built from the local source. The nginx
# config is inline. Adjust ports and passwords as needed.
#
# Ports:
#   - 14001: madhyamas-1 API
#   - 14002: madhyamas-2 API
#   - 14000: nginx load balancer (round-robin → 14001/14002)
#   - 5432:  PostgreSQL
#   - 6379:  Redis

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: madhyamas
      POSTGRES_USER: madhyamas
      POSTGRES_PASSWORD: testpass
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madhyamas"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  madhyamas-1:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      MADHYAMAS_HOST: "0.0.0.0"
      MADHYAMAS_API_PORT: "3001"
      MADHYAMAS_PROXY_PORT: "8888"
      MADHYAMAS_DATABASE_URL: "postgres://madhyamas:testpass@postgres:5432/madhyamas"
      MADHYAMAS_REDIS_URL: "redis://redis:6379"
      MADHYAMAS_ENABLE_AUTH: "true"
      MADHYAMAS_JWT_SECRET: "multi-instance-test-secret"
      MADHYAMAS_ADMIN_PASSWORD: "testpass123"
      RUST_LOG: "info"
    ports:
      - "14001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  madhyamas-2:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      MADHYAMAS_HOST: "0.0.0.0"
      MADHYAMAS_API_PORT: "3001"
      MADHYAMAS_PROXY_PORT: "8888"
      MADHYAMAS_DATABASE_URL: "postgres://madhyamas:testpass@postgres:5432/madhyamas"
      MADHYAMAS_REDIS_URL: "redis://redis:6379"
      MADHYAMAS_ENABLE_AUTH: "true"
      MADHYAMAS_JWT_SECRET: "multi-instance-test-secret"
      MADHYAMAS_ADMIN_PASSWORD: "testpass123"
      RUST_LOG: "info"
    ports:
      - "14002:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "14000:80"
    volumes:
      - ./nginx-multi.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - madhyamas-1
      - madhyamas-2

volumes:
  pg_data:
